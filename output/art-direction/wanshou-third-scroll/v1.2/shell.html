  <section id="menu-layer" class="lantern-dialog-layer" hidden><div id="chapter-menu" class="lantern-paper" tabindex="-1" role="dialog" aria-modal="true" aria-label="畫卷操作"><button id="menu-close" class="paper-close" aria-label="關閉">{{icon:X:18}}</button><h2>畫卷操作</h2><p>拖曳移動，滾輪或雙指縮放。凝神由你控制，沿着畫面慢慢找。小地圖的方框代表目前畫面，可拖動或點選位置。</p><div class="lantern-menu-controls"><button id="zoom-in" class="small-button">放大</button><button id="zoom-out" class="small-button">縮小</button><button id="overview" class="small-button">縮至滿版</button></div><p><button id="full-view" class="lantern-text-button">展開全卷</button><span id="zoom" class="sr-only"></span></p><label for="regions" class="lantern-source-note">自由看區域</label><select id="regions" class="chapter-region-select"></select><p id="source-note" class="lantern-source-note">官方原生清晰段落</p><details class="chapter-sources"><summary>畫作小記與資料來源</summary><p>近看與互動位於官方原生清晰段落；完整第三卷另用公開構圖。頭像與收藏圖樣為原畫衍生插圖，原畫為準；人物短句是遊戲虛構對白。</p><p>方向鍵移動畫面，＋／− 縮放。Tab 選取眼前人物與細節，Enter 點選，Escape 收起閱讀介面。收藏每類記一次，重新尋人仍保留。</p><a href="https://www.dpm.org.cn/collection/paint/232815.html" target="_blank" rel="noopener noreferrer">故宮館藏資料</a> · <a href="../source-provenance.json" target="_blank" rel="noopener noreferrer">原畫影像來源</a><p id="music-credit" class="lantern-source-note"></p><details><summary>本章收藏設定</summary><button id="clear-collections" class="lantern-text-button">清空本章收藏</button><span id="clear-confirm"></span></details></details><div class="lantern-paper-actions"><button id="menu-replay" class="lantern-text-button">重新尋人</button><button id="menu-cover" class="lantern-text-button">回到本章封面</button></div></div></section>
