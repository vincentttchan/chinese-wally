<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"> -->
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>顾恺之洛神图卷</title>
    <script src="/static/themes/js/jquery.js?v="></script>
    <script src="/static/bigimg/openseadragon.min.js?v="></script>
    <!-- 将openseadragon.min.js引入 -->
    <style>
        html, body, #openseadragon1 {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }
        .watermark{
            text-align: center;
            position: absolute;
            width: 158px;
            height: 158px;
            z-index: 9999;
            font-weight: bold;
            font-size: larger;
            color: red;
            opacity: 0.5;
        }
    </style>
</head>

<body id="byxBody">
<div id="openseadragon1" style="width: 100%; background-color:#000;"></div>
<div id="watermark4" class="watermark">
    <img src="/static/themes/image/logo11.png" width="118">
</div>
</body>

<script type="text/javascript">
    OpenSeadragon({
        id: "openseadragon1", //body中挂载的id
        constrainDuringPan: false,
        visibilityRatio: 0.9,
        showFullPageControl: false,
        prefixUrl: "/static/bigimg/images/", //openseadragon自带的图片也是文件中的路径

        // showNavigationControl: false,
        // homeFillsViewer:true,
        // showFullPageControl: false,
        // showNavigator: true,
        // navPrevNextWrap: false,
        // setFullPage:{
        //   fullPage:true,
        //   fullScreen:true,
        // },.
        // setFullScreen(fullPage),
        // setFullScreen:{
        //   fullPage:true,
        // },
        tileSources: {
            Image: {
                xmlns: "https://schemas.microsoft.com/deepzoom/2009",

                Url: "https://shuziwenwu-1259446244.cos.ap-beijing.myqcloud.com/relic/2016364543087083520/image-bundle/", //这里是3步骤中的dzc_output_files文件

                Overlap: "1", //这里是3步骤中xml相同字段给的值，只要打开xml对号入座即可

                TileSize: "510", //这里是3步骤中xml相同字段给的值，只要打开xml对号入座即可

                Format: "png", //这里是3步骤中xml相同字段给的值，只要打开xml对号入座即可

                Size: {
                    Height: "2160", //这里是3步骤中xml相同字段给的值，只要打开xml对号入座即可

                    Width: "82520", //这里是3步骤中xml相同字段给的值，只要打开xml对号入座即可
                },
            },
        },
    });
    $("#watermark4").css("top", $(window).height() / 2 - Math.random() * 100);
    $("#watermark4").css("left", $(window).width() / 2 + Math.random() * 100);

    $(function() {
        $("#byxBody").height($(window).height());
        $("#byxBody").width($(window).width());
    });

    //屏幕翻转监听
    // 判断屏幕是否旋转

    function orientationChange() {
        switch (window.orientation) {

            case 0:
                $("#byxBody").height($(window).height());
                $("#byxBody").width($(window).width());
                //alert("肖像模式 0,screen-width: " + screen.width + "; screen-height:" + screen.height);
                break;

            case -90:
                $("#byxBody").height($(window).height() );
                $("#byxBody").width($(window).width() );
                //alert("左旋 -90,screen-width: " + screen.width + "; screen-height:" + screen.height);
                break;

            case 90:
                $("#byxBody").height($(window).height() );
                $("#byxBody").width($(window).width() );
                //alert("右旋 90,screen-width: " + screen.width + "; screen-height:" + screen.height);
                break;
            case 180:
                //alert("风景模式 180,screen-width: " + screen.width + "; screen-height:" + screen.height);
                $("#byxBody").height($(window).height() );
                $("#byxBody").width($(window).width() );
                break;

        }
    }
    // 添加事件监听
    addEventListener('load', function() {
        orientationChange();
        window.onorientationchange = orientationChange;
    });
    document.onkeydown = function() {
        console.log(window.event.keyCode)
        if (window.event && window.event.keyCode == 123) {
            return false;
        }
    }
    function checkElement() {
        if (!document.getElementById("watermark4")) {
            location.reload();
        }
    }
    setInterval("checkElement()", 300);
</script>
</html>
