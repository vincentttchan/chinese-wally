人，依次俗稱狀元、榜眼、探花；二甲與三甲也在榜上，考中者統稱進士。`,`所以，「金榜題名」不只指考中狀元，也包含榜上其他進士。不同朝代、不同級別的考試，制度和稱號會有差異。`],note:`本關城市、人物與尋人故事均為虛構，畫風參照《清明上河圖》。以上以清代制度作文化補充，並非對畫中事件的歷史還原。`,question:{prompt:`依照文章，哪一項對「金榜題名」的理解正確？`,options:[`只有考中狀元才算金榜題名`,`榜上錄取的進士都算金榜題名`,`參加殿試就算金榜題名`],correctIndex:1,explanation:`金榜包括一甲、二甲與三甲的錄取者，所以「金榜題名」也包含榜上其他進士。`,retryHints:[`再看看第二、三段：一甲之外，二甲與三甲也列在金榜上。`,``,`金榜公布錄取結果。想想「參加考試」與「榜上有名」是否相同。`]},sources:[{title:`故宮博物院｜清代殿試`,url:`https://www.dpm.org.cn/court/system/236363.html`},{title:`文化部文化資產局｜清朝科舉考試金榜`,url:`https://twh.boch.gov.tw/world-memory/detail.aspx?id=994`}]},de={examination:{id:`examination`,scene:le,intro:[{title:`科舉放榜日`,text:`今日放榜。

他穿青衫，帶着方形書箱。`,action:`記住了，開始尋人`}],footer:`一卷市井，藏着一場相逢。`,mission:`替書童尋回考生`,evidenceWord:`線索`,targetDescription:`青色長衫，帶着方形書箱。`,targetPortrait:L(`art/portraits/scholar-cutout-v1.png`),initialRegion:{x:.7,y:.5},instruction:`回想開始前的人物圖，左右拖曳、放大畫卷，找到後點選他。找不到時按「看看提示」，也可以向畫中人問訊。`,objectives:{exploring:`回想剛才的人物圖，找回考生，找到便可完成。問訊與線索都可選，不必收齊。`,complete:`書童與考生，終於相逢。`},guide:`開始前先看清考生的人物圖，準備好才按「記住了，開始尋人」。入畫後人物圖會收起，請回想他的樣子，找到後點選便完成，無需收集線索。找不到時，可按「看看提示」逐步查看文字描述、地標與區域，也可向抄榜人、榜前圍觀者或茶攤掌櫃問訊。預設凝神模式可自行移動觀察範圍，仔細看畫中人物與細節；覺得太難可按右上「彩色」轉為全彩，亦可再切回凝神；所有問訊和觀察都是可選的幫助。`,alt:`原創科舉放榜日全景古畫，左側榜牆、中央茶攤、右側橋頭與人群`,endingTitle:`人海相逢`,knowledgeLabel:`科舉小知識`,knowledge:ue,steam:{x:.406,y:.273},hints:{copyist:{messages:[`忙於記錄的人，或許比匆匆過客更留意身旁。`,`榜文附近，除了抬頭張望的人，也有人低頭忙碌。`,`已展開榜牆一帶。留意正伏案持筆的人。`],region:{x:.14,y:.43}},"tea-keeper":{messages:[`買茶的人歇腳時，掌櫃也留意了他們的行李。`,`沿街看看茶攤，找一位正在招呼客人的掌櫃。`,`已展開茶攤一帶。問問掌櫃，聽聽考生隨身帶着甚麼。`],region:{x:.47,y:.49}},"board-observer":{messages:[`擠在人潮裏的人，或許聽過別人離開前說的話。`,`榜牆前有人忙着記錄，也有人一邊看、一邊與旁人交談。`,`已展開看榜的人群。留意榜文右端、舉手的赭衣人。`],region:{x:.23,y:.29}},"scholar-target":{messages:[`還記得剛才的考生嗎？他穿青色長衫，身旁有一只方形書箱。`,`往畫卷右側找找。他在有石欄的橋邊等候，留意附近穿青衫的人。`,`已帶你到石橋一帶。找找穿青衫、帶着方形書箱的人，再點選他。`],region:{x:.84,y:.55}}}}},R=e=>`examination`,z=e=>`#examination`,B=[{id:`lantern-festival`,title:`宮中鬧元宵`,painting:`明代 · 憲宗元宵行樂圖`,href:`#lantern-festival`,status:`已完成`,description:`循着人物的樣貌，看看宮中的元宵遊戲與節慶活動。`,image:L(`art/lantern-festival/detail-9.jpg`),imageAlt:`憲宗元宵行樂圖局部：黃帳旁的皇帝與庭院中的節慶活動`},{id:`kangqu-listening`,title:`在人群中聽樂`,painting:`清代 · 康衢駢慶`,href:`#kangqu-listening`,status:`新章節`,description:`尋找四位畫中人，從樂隊、儀仗與彩牆讀懂萬壽慶典。`,image:L(`chapters/kangqu-listening/art/overview.jpg`),imageAlt:`康衢駢慶原畫局部：亭內樂隊、儀仗隊列與吉祥彩牆`}],V=L(`chapters/kangqu-listening/index.html`);function fe(e){return typeof window<`u`&&window.location.protocol===`file:`&&e.id===`kangqu-listening`?V:e.href}function pe({current:e}){return(0,x.jsxs)(`nav`,{className:`chapter-links`,"aria-label":`選擇畫卷`,children:[B.map(t=>(0,x.jsxs)(`a`,{href:fe(t),"data-preload-src":t.id===`lantern-festival`
