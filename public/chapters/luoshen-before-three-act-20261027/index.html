  0%{opacity:0;transform:translate(0,8px) scale(.65);}

  65%{opacity:1;transform:translate(var(--arc-x),var(--arc-y)) scale(.72);}
  95%{opacity:1;transform:translate(var(--token-x),var(--token-y)) scale(.18);}
  100%{opacity:0;transform:translate(var(--token-x),var(--token-y)) scale(.08);}
}

.luoshen-birds-preview .lantern-market-preview-header{z-index:28;}
.luoshen-bird-hit:focus-visible{outline:2px dashed #8e5d3e;outline-offset:6px;}
@media(max-width:699px){.luoshen-birds-preview .lantern-market-preview-header{gap:12px;font-size:12px;}.luoshen-bird-animation .lantern-market-caption{bottom:16px;max-width:calc(100vw - 32px);white-space:nowrap;}}

.luoshen-game:not(.luoshen-birds-preview) .luoshen-bird-animation .lantern-market-caption{bottom:100px;}
.luoshen-game.has-observation-note:not(.luoshen-birds-preview) .luoshen-bird-animation .lantern-market-caption{display:none;}

/* Redrawn birds share the original painting transform. No separate page or paper. */
.luoshen-redrawn-stage{position:absolute;inset:0;z-index:24;overflow:hidden;pointer-events:none;}
.luoshen-redrawn-patch{position:absolute;filter:var(--painting-grade);}
.luoshen-redrawn-stage .luoshen-bird-world{transition:opacity 220ms ease;will-change:opacity;}
@media(prefers-reduced-motion:reduce){.luoshen-redrawn-stage .luoshen-bird-world{transition:none;}}
.luoshen-ribbon-animation{position:absolute;inset:0;z-index:24;overflow:hidden;pointer-events:none;}
.luoshen-ribbon-world{position:absolute;left:0;top:0;transform-origin:0 0;}
.luoshen-ribbon-patch{position:absolute;filter:var(--painting-grade);}
.luoshen-ribbon-hit{position:absolute;transform:translate(-50%,-50%);z-index:25;background:transparent;padding:0;cursor:pointer;}
.luoshen-ribbon-preview .lantern-observation-note{z-index:27;}
.luoshen-ribbon-preview .lantern-market-preview-header{z-index:28;}
.luoshen-ribbon-hit:focus-visible{outline:2px dashed #8e5d3e;outline-offset:6px;}
@media(max-width:699px){.luoshen-ribbon-preview .lantern-market-preview-header{gap:12px;font-size:12px;}.luoshen-ribbon-animation .lantern-market-caption{bottom:16px;max-width:calc(100vw - 32px);white-space:nowrap;}}

.luoshen-ribbon-preview .luoshen-ribbon-animation .lantern-market-caption{bottom:24px;}

.luoshen-game:not(.luoshen-ribbon-preview) .luoshen-ribbon-animation .lantern-market-caption{bottom:100px;}
.luoshen-game.has-observation-note:not(.luoshen-ribbon-preview) .luoshen-ribbon-animation .lantern-market-caption{display:none;}
/* This optional animation reserves its paper using the actual clamped camera. */
.luoshen-game.is-figure-context .lantern-footer{visibility:hidden;}
.luoshen-game.is-figure-context .luoshen-ribbon-animation .lantern-market-caption{display:none;}
.luoshen-game.is-figure-context .luoshen-note-compact,
.luoshen-game.is-figure-context .luoshen-note-compact.is-above-detail{left:auto;right:24px;top:78px;bottom:auto;max-height:var(--figure-note-height);}
.luoshen-game.is-figure-stacked .luoshen-note-compact,
.luoshen-game.is-figure-stacked .luoshen-note-compact.is-above-detail{left:auto;right:16px;top:auto;bottom:max(16px,env(safe-area-inset-bottom));max-height:calc(var(--figure-note-height) - env(safe-area-inset-bottom));}
.luoshen-figure-action-row{display:flex;align-items:center;gap:12px;}
.luoshen-game .luoshen-figure-action-row .lantern-note-next{flex:1;width:auto;}
.luoshen-game .luoshen-figure-action-row .lantern-note-secondary{flex:none;white-space:nowrap;}
.is-figure-context .luoshen-note-primary .lantern-note-tabs{margin:0;}
.luoshen-dragon-preview .lantern-observation-note{z-index:27;}
.luoshen-dragon-preview .lantern-market-preview-header{z-index:28;}
.luoshen-dragon-preview-nav{position:absolute;z-index:28;left:28px;top:24px;}
.luoshen-dragon-preview-nav .round-control{width:44px;height:44px;}
.luoshen-dragon-preview-nav .art-icon{transform:rotate(180deg);}
@media(max-width:699px){.luoshen-dragon-preview-nav{left:16px;top:16px;}}

/* The full toolbar would cover the birds above the dragon. The paper retains all actions. */
.luoshen-game.is-dragon-context .lantern-hud{visibility:hidden;}

:root {
  font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  color: #353c32; background: #c6b18a; font-synthesis: none;
  --paper: #f5efdf; --ink: #353c32; --green: #485a47; --red: #954c37; --line: #b8a58266;
  --motion-instant: 120ms; --motion-fast: 180ms; --motion-standard: 260ms; --motion-panel: 380ms; --motion-scene: 550ms; --motion-cinematic: 950ms;
  --ease-ui: cubic-bezier(.22,1,.36,1); --ease-soft: cubic-bezier(.33,1,.68,1); --ease-scene: cubic-bezier(.16,1,.3,1);
  --painting-grade: saturate(.68) sepia(.09) contrast(.96) brightness(1.045);
}
* {box-sizing: border-box;}
html, body, #root {margin: 0; width: 100%; height: 100%; overflow: hidden;}
body {min-width: 320px;}
button {font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
button:disabled {cursor: default;}
button:focus-visible, a:focus-visible {outline: 2px solid var(--red); outline-offset: 4px;}
button:not(.actor-hitbox) {transition: background var(--motion-fast) var(--ease-ui), opacity var(--motion-fast) var(--ease-ui);}
.sr-only {position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;}
.immersive-game {position: relative; width: 100%; height: 100%; height: 100dvh; isolation: isolate; overflow: clip;}
.scroll-frame, .scroll-viewport {position: absolute; inset: 0; width: 100%; height: 100%;}
.scroll-frame {background-color: #c6b18a; background-position: left center; background-size: cover; background-repeat: no-repeat;}
.scroll-viewport {overflow: clip; cursor: grab; touch-action: none; user-select: none; background: transparent; outline-offset: -4px;}
.scroll-viewport.is-dragging {cursor: grabbing;}
.painting-world {position: absolute; inset: 0 auto auto 0; transform-origin: 0 0; will-change: transform;}
.painting {width: 100%; height: 100%; display: block; pointer-events: none; filter: var(--painting-grade);}
.painting-detail-tile {position: absolute; top: 0; height: 100%; display: block; pointer-events: none; filter: var(--painting-grade);}
/* One movable observation area; the original painting stays intact. */
.observation-light {position: absolute; inset: 0; pointer-events: none;}
.observation-shade, .observation-warmth {position: absolute; inset: 0; pointer-events: none;}
.observation-shade {backdrop-filter: grayscale(1); -webkit-backdrop-filter: grayscale(1);}
.is-focusing .observation-shade {background: #2525251a; backdrop-filter: grayscale(1) brightness(.96); -webkit-backdrop-filter: grayscale(1) brightness(.96); mask-image: radial-gradient(circle at var(--focus-x) var(--focus-y), transparent 0, transparent calc(var(--focus-radius) * .64), #000 calc(var(--focus-radius) * 1.08)); -webkit-mask-image: radial-gradient(circle at var(--focus-x) var(--focus-y), transparent 0, transparent calc(var(--focus-radius) * .64), #000 calc(var(--focus-radius) * 1.08));}
.observation-warmth {background: radial-gradient(circle at var(--focus-x) var(--focus-y), #f8d68609 0, transparent var(--focus-radius));}
.focus-control {font-size: 12px; letter-spacing: .06em; white-space: nowrap;}
.round-control.focus-control.is-on, .round-control.focus-control.is-on:hover {background: #47573c; color: #fff3d7; box-shadow: 0 0 0 1px #f0dfae80;}
.focus-control:disabled {opacity: .4;}
.focus-instruction {position: absolute; z-index: 5; pointer-events: none; left: 50%; transform: translateX(-50%); bottom: 86px; margin: 0; font-size: 11px; letter-spacing: .08em; color: #f4ead6; text-shadow: 0 1px 5px #201f19; text-align: center; width: max-content; max-width: calc(100% - 40px);}
.focus-touch {display: none;}
@media (pointer: coarse) {.focus-desktop {display: none;}.focus-touch {display: inline;}}
.is-ready .painting {animation: painting-arrives 400ms var(--ease-soft) both;}
.scene-vignette {position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg,#2929290c,transparent 120px,transparent 80%,#1f1f1f28); box-shadow: inset 0 0 95px #29292915; transition: background var(--motion-scene);}
.ending-visible .scene-vignette {background-color: #151a160d;}
/* Keep failed-load recovery reachable above the introduction. */
.actor-hitbox {position: absolute; transform: translate(-50%,-50%); padding: 0; background: transparent; cursor: pointer;}
.actor-hitbox:focus-visible {outline: var(--outline-width,2px) dashed var(--red); outline-offset: 0; background: #f2e7c610;}
.is-dragging .actor-hitbox {cursor: grabbing;}
.scene-hud {position: absolute; z-index: 5; top: max(28px,env(safe-area-inset-top)); left: max(32px,env(safe-area-inset-left)); right: max(32px,env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; pointer-events: none;}
.mission {width: min(440px,calc(100vw - 225px)); background: #f4ebd4e8; border: 1px solid #ddcba077; border-radius: 7px; box-shadow: 0 4px 22px #46392115; backdrop-filter: blur(3px); pointer-events: auto; opacity: 0; transition: width var(--motion-panel) var(--ease-ui);}
.scene-loaded .mission {animation: paper-seen var(--motion-panel) var(--ease-ui) 300ms both;}
.mission-summary {width: 100%; display: flex; align-items: flex-start; gap: 13px; padding: 17px 18px 15px; background: transparent; text-align: left;}
.mini-seal {color: var(--red); border: 1px solid currentColor; padding: 2px 5px; font-size: 25px; line-height: 1.35; transform: rotate(-4deg); flex-shrink: 0;}
.mission-heading {flex: 1; min-width: 0;}
.mission-chapter {display: block; font-size: 11px; letter-spacing: .14em; line-height: 1.4; margin-bottom: 5px;}
.mission-heading strong {display: block; font-size: 15px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;}
.mission-objective {display: block; font-size: 10px; line-height: 1.7; margin-top: 6px;}
.mission-count {font: 18px Georgia,serif; white-space: nowrap; border-left: 1px solid #a6977880; padding-left: 16px; margin: 17px 3px 0 0;}
.mission-count b {color: var(--red); font-weight: 400;}
.mission-chevron {margin-top: 4px; flex-shrink: 0; transition: transform var(--motion-panel) var(--ease-ui);}
.mission-details {padding: 0 19px 16px 69px;}
.mission-details p {font-size: 11px; line-height: 1.9; color: #666c53; margin: 0 0 12px;}
.mission-details p:last-child {margin-bottom: 0;}
.mission-details .primary-button {font-size: 12px; min-height: 42px; padding: 10px 13px;}
.mission.is-collapsed {width: 210px;}
.is-collapsed .mission-summary {padding: 12px 15px; align-items: center;}
.is-collapsed .mini-seal {font-size: 21px;}
.is-collapsed .mission-chapter {margin: 0; font-size: 12px;}
.is-collapsed .mission-heading strong, .is-collapsed .mission-objective, .is-collapsed .mission-count {display: none;}
.is-collapsed .mission-chevron {margin: 0; transform: rotate(-90deg);}
.scene-settings {display: flex; gap: 14px; pointer-events: auto;}
.round-control {width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border-radius: 50%; background: #f5eddaed; color: #5b5e49; box-shadow: 0 1px 9px #342b1e10; opacity: 0;}
.scene-loaded .round-control {animation: soft-arrive var(--motion-fast) var(--ease-ui) 650ms both;}
.scene-loaded .round-control:nth-child(2) {animation-delay: 700ms;}
.scene-loaded .round-control:nth-child(3) {animation-delay: 750ms;}
.round-control:hover {background: #fff5dd;}
.round-control.is-on {color: #405b36;}
.settings-paper {position: absolute; z-index: 8; top: 82px; right: max(32px,env(safe-area-inset-right)); width: 210px; background: #f4ebd9f2; border: 1px solid #bcaa8477; border-radius: 5px; box-shadow: 0 8px 25px #39322025; padding: 17px; animation: paper-unfold var(--motion-panel) var(--ease-ui) both;}
.settings-paper .card-kicker {display: block; margin: 0 5px 8px;}
.settings-paper button {width: 100%; background: transparent; display: flex; align-items: center; gap: 11px; padding: 11px 5px; font-size: 12px; text-align: left;}
.settings-paper button:hover {background: #e3dfca88;}
.bottom-hud {position: absolute; z-index: 5; left: max(32px,env(safe-area-inset-left)); right: max(32px,env(safe-area-inset-right)); bottom: max(28px,env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 16px; pointer-events: none;}
.bottom-hud button {pointer-events: auto;}
.notebook-toggle {height: 46px; display: inline-flex; align-items: center; gap: 12px; padding: 0 18px; color: #f7efdb; background: #3c4935ed; border: 1px solid #e4d4ae60; border-radius: 4px; box-shadow: 0 3px 18px #282d2420; font-size: 13px; letter-spacing: .08em; opacity: 0;}
.scene-loaded .notebook-toggle {animation: soft-arrive var(--motion-panel) var(--ease-ui) 900ms both;}
.notebook-toggle:disabled {filter: saturate(.5);}
.notebook-toggle:hover:not(:disabled) {background: #303f29;}
.notebook-count {display: inline-flex; gap: 6px; font: 18px Georgia,serif; padding-left: 14px; border-left: 1px solid #e8dfcb50; animation: count-fade var(--motion-standard) var(--ease-ui);}
.notebook-count small {font-size: 13px; opacity: .75; align-self: center;}
.gesture-note {position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .07em; color: #f7efdc; text-shadow: 0 1px 5px #382f1e; display: flex; align-items: center; gap: 12px; white-space: nowrap; opacity: 0; transition: opacity var(--motion-fast) var(--ease-ui);}
.scene-loaded .gesture-note:not(.is-dismissed) {animation: soft-arrive var(--motion-panel) var(--ease-ui) 1200ms both;}
.gesture-note.is-dismissed {opacity: 0;}
.hint-button {margin-left: auto; height: 46px; display: inline-flex; align-items: center; gap: 10px; padding: 0 17px; border-radius: 24px; border: 1px solid #e8d8b655; background: #5e604cd9; color: #f4ead1; font-size: 12px; letter-spacing: .08em; opacity: .8;}
.hint-button:hover:not(:disabled) {opacity: 1; background: #565c43f2;}
.hint-button:disabled {opacity: .4;}
.character-mark {position: absolute; pointer-events: none; white-space: nowrap; font-size: 12px; padding: 7px 12px; background: #f4ebd9ee; color: #4d5540; border: 1px solid #c9b68d70; box-shadow: 0 3px 12px #39322016;}
.mark-wrong {animation: wrong-notice 1.4s var(--ease-soft) both;}
.mark-found, .mark-clue {color: var(--red); border: 1px solid currentColor; background: #f6ecd3e8; font-size: 18px; letter-spacing: .08em; padding: 5px 8px; animation: seal-seen 220ms var(--ease-soft) both;}
.mark-clue {font-size: 13px;}
.card-kicker {font-size: 10px; color: #81775e; letter-spacing: .14em;}
.primary-button {display: flex; align-items: center; justify-content: space-between; background: var(--green); color: #f7f4e9; width: 100%; padding: 13px 16px; font-size: 13px; letter-spacing: .08em; min-height: 46px;}
.primary-button:hover:not(:disabled) {background: #354b34;}
.primary-button:disabled {opacity: .5;}
.notebook-paper, .witness-paper, .reading-paper {border: 1px solid #c6b38e; color: var(--ink); padding: 29px; background: #f7f0dff7; box-shadow: 0 12px 45px #30352230; border-radius: 3px;}
.notebook-paper {position: absolute; z-index: 8; left: max(32px,env(safe-area-inset-left)); bottom: 87px; width: min(420px,calc(100% - 64px)); max-height: calc(100dvh - 120px); overflow-y: auto; animation: paper-unfold var(--motion-panel) var(--ease-ui) both; transform-origin: left bottom;}
.paper-close {position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; display: grid; place-items: center; background: transparent; color: #777b69;}
.notebook-paper h2, .witness-paper h2, .reading-paper h2 {font-size: 24px; font-weight: 500; letter-spacing: .08em; margin: 13px 0 17px;}
.journal-count {font: 13px Georgia,serif; margin-left: 12px; color: #7a8069; letter-spacing: 0;}
.clue-list {display: flex; flex-direction: column; margin: 10px 0 18px;}
.clue-card {padding: 18px 0; border-top: 1px solid var(--line); background: transparent; text-align: left; display: flex; align-items: center; gap: 14px; animation: soft-arrive var(--motion-standard) var(--ease-ui) var(--clue-delay) both;}
.clue-card:disabled {opacity: .62;}
.clue-card:hover:not(:disabled) {background: #e9e5d566;}
.painted-portrait {position: relative; display: block; width: 56px; height: 76px; flex-shrink: 0; overflow: hidden; border-radius: 2px; background: #d7c59f; mask-image: linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);}
.painted-portrait img {position: absolute; max-width: none; pointer-events: none;}
.clue-content {flex: 1; min-width: 0;}
.clue-kicker {font-size: 9px; letter-spacing: .1em; color: #818569;}
.clue-title {display: block; font-size: 14px; margin: 5px 0; letter-spacing: .05em;}
.clue-description {display: block; color: #727961; font-size: 11px; line-height: 1.9;}
.journal-objective {font-size: 11px; color: #646e53; line-height: 1.9; margin: 0;}
.journal-section-note {font-size: 12px; color: #646e53; line-height: 1.8; margin: 0 0 12px;}
.supplementary-clues {margin-top: 22px; padding-top: 19px; border-top: 1px solid var(--line);}
.supplementary-clues h3 {font-size: 16px; font-weight: 500; margin: 0 0 10px; letter-spacing: .05em;}
.supplementary-clues h3 span {display: block; margin-top: 6px; font-size: 11px; color: #646e53; letter-spacing: .02em;}
.witness-paper {position: absolute; z-index: 9; width: min(350px,calc(100% - 40px)); left: 50%; top: 50%; transform: translate(-50%,-50%); animation: soft-arrive var(--motion-standard) var(--ease-ui) both;}
.witness-paper.is-anchored {left: clamp(24px,var(--dialog-x,24px),calc(100vw - 374px)); top: clamp(94px,var(--dialog-y,120px),calc(100dvh - 330px)); transform: none;}
.witness-quote {font-size: 17px; line-height: 2; color: #626e55; border-left: 2px solid #a8b291; padding-left: 14px; margin: 0 0 24px;}
.hint-paper {position: absolute; z-index: 7; bottom: 88px; right: max(32px,env(safe-area-inset-right)); width: min(305px,calc(100% - 40px)); padding: 18px 22px; background: #f3ead7ee; border: 1px solid #c6b38e77; border-radius: 6px; box-shadow: 0 6px 25px #3f35221a; animation: paper-unfold var(--motion-panel) var(--ease-ui) both;}
.hint-paper p {font-size: 12px; color: #666e54; line-height: 1.9; margin: 8px 0 0;}
.scene-toast {position: absolute; z-index: 10; top: 165px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 11px 17px; background: #f5efdfeb; color: #4b5540; border: 1px solid var(--line); font-size: 12px; text-align: center; pointer-events: none; animation: soft-arrive var(--motion-fast) var(--ease-ui) both;}
.skip-ending {position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #f5ebd0; text-shadow: 0 1px 4px #28251c; background: transparent; font-size: 11px; padding: 10px 15px;}
.ending-card {position: absolute; z-index: 7; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(355px,calc(100% - 40px)); padding: 34px; background: #f5efdfef; border: 1px solid #d0bd94; text-align: center; box-shadow: 0 15px 60px #342d2430; animation: soft-arrive var(--motion-cinematic) var(--ease-soft) both;}
.ending-card h2 {font-size: 30px; letter-spacing: .15em; margin: 16px 0; font-weight: 500;}
.ending-card p {font-size: 12px; line-height: 2; color: #69725b; margin: 0 0 23px;}
.replay-button {display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px auto 0; background: transparent; color: #68745d; padding: 7px 12px; font-size: 11px;}
.reading-paper {width: min(520px,calc(100% - 36px)); max-height: calc(100dvh - 50px); overflow-y: auto; padding: 35px; animation: soft-arrive var(--motion-panel) var(--ease-ui) both;}
.reading-paper::backdrop {background: #333a2b35;}
.reading-paper h2 {line-height: 1.7; font-size: 24px;}
.reading-paper p {font-size: 13px; line-height: 2.1; color: #606b52; margin: 15px 0;}
.knowledge-scope {font-size: 11px; color: #8b6848; letter-spacing: .07em;}
.knowledge-note {font-size: 10px; color: #827b64; line-height: 1.9; padding: 14px 0; border-top: 1px solid var(--line); margin-top: 22px;}
.knowledge-sources {font-size: 10px; color: #67745a; margin: 7px 0 22px;}
.knowledge-sources > span {display: block; margin-bottom: 8px; color: #8a8067;}
.knowledge-sources a {color: inherit; display: flex; align-items: center; gap: 7px; line-height: 1.9; padding: 3px 0; text-underline-offset: 3px;}
.scene-status {position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-size: 14px; background: #d7c59f; letter-spacing: .13em;}
.loading-seal {font-size: 33px; color: var(--red); border: 1px solid currentColor; padding: 8px 12px;}
.small-button {display: flex; align-items: center; gap: 8px; background: #f6efdf; border: 1px solid var(--line); padding: 10px 15px; font-size: 12px;}
.living-painting {position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden;}
.living-painting.is-still {opacity: 0;}
.living-painting.is-still * {animation-play-state: paused !important;}
.river-light {mix-blend-mode: soft-light;}
.river-ripples {animation: river-drift 10s linear infinite; opacity: 0;}
.ripple-1 {animation-delay: -3.3s;}.ripple-2 {animation-delay: -6.6s;}
.steam-wisp {opacity: 0; animation: steam-rise 9s var(--ease-soft) infinite;}.wisp-two {animation-delay: -4.5s;}
@keyframes painting-arrives {from {opacity: 0;} to {opacity: 1;}}
@keyframes paper-seen {from {opacity: 0; transform: translateY(-6px);} to {opacity: 1; transform: translateY(0);}}
@keyframes soft-arrive {from {opacity: 0;} to {opacity: 1;}}
@keyframes paper-unfold {from {opacity: 0; transform: translateY(12px) scale(.985);} to {opacity: 1; transform: translateY(0) scale(1);}}
@keyframes count-fade {from {opacity: .25;} to {opacity: 1;}}
@keyframes seal-seen {from {opacity: 0;} to {opacity: 1;}}
@keyframes wrong-notice {0% {opacity: 0;} 15%,75% {opacity: 1;} 100% {opacity: 0;}}
@keyframes atmosphere {0%,100% {opacity: 0;} 20%,70% {opacity: 1;}}
@keyframes river-drift {0% {opacity: 0; transform: translateX(-5px);} 30%,60% {opacity: .38;} 100% {opacity: 0; transform: translateX(8px);}}
@keyframes steam-rise {0% {opacity: 0; transform: translate(0,3px);} 25% {opacity: .22;} 70% {opacity: .12;} 100% {opacity: 0; transform: translate(6px,-18px);}}
@media (max-width: 900px) {.gesture-note {font-size: 10px; gap: 8px;}.mission {width: 420px;}.mission-summary {padding: 15px; gap: 10px;}.mission-count {padding-left: 12px;}.scene-settings {gap: 9px;}}

.phase-exploring .mission-details, .phase-complete .mission-details {display: none;}

/* Generated paper and painted raster icons replace the interface's vector art. */
.art-icon {display: inline-block; flex-shrink: 0; background-image: url('../../art/ui/painted-icons.png'); background-repeat: no-repeat; background-size: 400% 400%; vertical-align: middle; pointer-events: none;}

.art-zoom b {position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 400;}

.mission, .settings-paper, .notebook-paper, .witness-paper, .reading-paper, .hint-paper, .ending-card, .notebook-toggle, .hint-button {background: #f4ead3; border: 0 solid transparent; border-image: url('../../art/ui/reading-paper.png') 180 fill / 18px / 0 stretch; backdrop-filter: none; border-radius: 2px;}
.notebook-toggle, .hint-button {color: var(--ink); opacity: 1;}
.notebook-toggle:hover:not(:disabled), .hint-button:hover:not(:disabled) {background-color: #f9efd8; filter: brightness(1.04);}
.notebook-count {border-color: #82785966;}
.notebook-toggle > .art-icon:first-child, .hint-button > .art-icon {width: 28px !important; height: 28px !important;}

/* A full-page prelude opens the painting; the mission is a small in-scene control. */
.introduction {position: absolute; inset: 0; z-index: 9; color: #353b30; background: linear-gradient(90deg,#f2ead5fa 0%,#f2ead5f5 21%,#f2ead5d9 35%,#f2ead573 49%,#f2ead50a 68%,transparent 80%); transition: opacity 600ms var(--ease-scene), transform 600ms var(--ease-scene);}
.introduction.is-leaving {opacity: 0; transform: translateX(-18px); pointer-events: none;}
.intro-brand {position: absolute; top: clamp(28px,6vh,65px); left: clamp(28px,6vw,100px); display: flex; align-items: center; gap: 16px; font-size: 12px; letter-spacing: .35em; color: #646653;}
.intro-brand > span {width: 34px; height: 1px; background: currentColor; opacity: .7;}
.intro-content {position: absolute; left: clamp(28px,6vw,100px); top: 50%; transform: translateY(-50%); width: 365px; display: grid; grid-template-columns: 220px 86px; gap: 42px; align-items: center;}
.intro-title {display: flex; flex-direction: column; align-items: center; gap: 24px;}
.intro-title h1 {writing-mode: vertical-rl; text-orientation: upright; font-size: clamp(52px,5.8vw,76px); line-height: 1.05; letter-spacing: .14em; font-weight: 500; margin: 0;}
.intro-seal {border: 1px solid #9a5039; color: #9a5039; writing-mode: vertical-rl; padding: 6px 5px; font-size: 13px; letter-spacing: .18em; transform: rotate(-3deg);}
.intro-chapter {font-size: 13px; letter-spacing: .38em; margin: 0 0 32px; color: #775e45;}
.intro-story, .intro-invitation {font-size: 14px; line-height: 2.25; margin: 0 0 22px; letter-spacing: .025em;}
.intro-invitation {color: #626853;}
.intro-enter {margin-top: 24px; padding: 15px 0; display: flex; align-items: center; justify-content: space-between; gap: 25px; width: 100%; background: transparent; border-block: 1px solid #716b4f66; font-size: 19px; letter-spacing: .18em;}
.intro-enter:hover:not(:disabled) {color: #924b35; background: #fff4d126;}
.intro-enter:disabled {opacity: .45;}
.intro-play-note {display: block; margin-top: 15px; font-size: 10px; letter-spacing: .15em; color: #74745d;}
.intro-footer {position: absolute; bottom: clamp(28px,6vh,65px); left: clamp(28px,6vw,100px); margin: 0; font-size: 11px; letter-spacing: .16em; color: #75755f;}
.intro-footer p {margin: 0;}
.chapter-links {display: flex; flex-wrap: nowrap; gap: 18px; width: max-content; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; margin-top: 15px; font-size: 11px; letter-spacing: .08em;}
.chapter-links::-webkit-scrollbar {display: none;}
.chapter-links > * {flex: 0 0 auto; white-space: nowrap;}
.chapter-links a {display: inline-flex; align-items: center; gap: 7px; color: inherit; text-decoration: none; padding: 6px 0; border-bottom: 1px solid transparent;}
.chapter-links a[aria-current] {color: var(--red); border-color: currentColor;}
.chapter-links a:hover {color: var(--red);}
.chapter-links a:focus-visible {outline: 1px solid var(--red); outline-offset: 3px;}
.chapter-links a span {font-size: 9px; opacity: .65;}
.chapter-pending {display: inline-flex; align-items: center; gap: 7px; padding: 6px 0; color: #8c856f;}
.chapter-pending > span {font-size: 9px; opacity: .65;}

.phase-intro .scroll-viewport:focus {outline: none;}

.mission-summary, .is-collapsed .mission-summary {padding: 12px 14px; align-items: center; gap: 12px;}
.mission-chapter, .is-collapsed .mission-chapter {display: block; font-size: 13px; letter-spacing: .1em; margin: 0;}
.mission-objective, .is-collapsed .mission-objective {display: block; font-size: 9px; letter-spacing: .06em; line-height: 1.5; margin-top: 3px;}

.mission.is-expanded .mission-chevron {transform: rotate(180deg);}
.phase-exploring .mission-details, .phase-complete .mission-details {display: block; position: absolute; top: calc(100% + 9px); left: 0; width: 292px; padding: 19px 21px; background: #f1ead7f5; border: 1px solid #c6bb9970; border-radius: 3px; box-shadow: 0 3px 20px #322b1818;}
.mission-details[hidden] {display: none !important;}

/* The story unfolds at the reader's pace, one short scene at a time. */
.intro-narrative {min-height: 178px;}

/* A single reading question, styled as a small annotation on the paper. */
.knowledge-quiz {margin-top: 25px; padding: 20px 0 5px; border-top: 1px solid var(--line);}
.knowledge-quiz fieldset {border: 0; padding: 0; margin: 13px 0 16px; min-width: 0;}

.quiz-option {display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 12px 10px; margin: 7px 0; border: 1px solid #95896b45; background: #fffaf029; cursor: pointer; font-size: 12px; line-height: 1.8;}

.quiz-letter {color: #897755; flex-shrink: 0;}

.clue-card:not(.is-collected):not(:disabled) {cursor: pointer; opacity: 1;}
.clue-card:not(.is-collected):not(:disabled):hover {background: #d9c59424;}
.journal-section-note {font-size: 13px; line-height: 1.9;}
@media (max-width: 700px) {

  .memory-mission .mission-objective {font-size: 12px;}

ch:`我不由得停下腳步。`,lead:`水邊出現了神女。認清她的髮式，再去尋她。`,result:`同行者收攏衣袖，曹植卻向外展袖。兩種姿態，讓初遇時的他格外顯眼。`,supplement:`這裡比較的是原畫可見的動作；人物當時的心情不能單憑姿態確定。`,reading:[`C1`,`attendant-opening-beard`],comparisons:[{label:`看曹植展袖`,actors:[`C1`]},{label:`看同行者收袖`,actors:[`attendant-opening-beard`]}],observations:[w(`sleeve-C1`,`曹植展開的衣袖`,[17990,620,18120,750],`看看曹植展開的衣袖。`),w(`sleeve-attendant`,`同行者收攏的衣袖`,x(9,[0,565,70,715]),`再看同行者收攏的衣袖。`)]},{noteTitle:`飛鳥與龍形`,noteResult:`「翩若驚鴻，婉若游龍」：如鳥輕盈，如龍婉轉。`,id:`L1`,title:`水邊的神女`,name:`洛神`,appearance:`看看面形與雙環高髮。`,hint:`衣帶在身旁延展，她獨立在水岸之間。`,region:`留意初見隊伍以左的水邊。`,speech:`你也看見我了？`,lead:`岸上還有坐下來的曹植，再尋他的身影。`,result:`「翩若驚鴻，婉若游龍」：輕盈如飛鳥，婉轉如游龍。回看神女的姿態，再看畫中的鳥與龍。`,supplement:`飛鳥與游龍是《洛神賦》形容神女的比喻；原畫也出現相應形象。這是圖文對讀，不把畫中動物一概當成比喻的直接圖解。`,reading:[`L1`],comparisons:[{label:`看神女姿態`,actors:[`L1`]},{label:`看飛鳥與龍形`,actors:[`bird`,`dragon-first`]}],observations:[w(`bird`,`飛鳥`,x(8,[1120,50,1330,152]),`先看神女附近的飛鳥。`),w(`dragon-first`,`開首龍形`,x(8,[1055,165,1375,435]),`再看飛鳥附近的龍形。`)]},{noteTitle:`髮式與姿態`,noteResult:`相似髮式，連起兩次身影；這次神女來到曹植的榻前。`,id:`C2`,title:`同一人，另一時刻`,name:`曹植`,appearance:`比對鬚貌、面形與冠。`,hint:`這一次，他坐在榻上，身旁仍有同行者。`,region:`往畫卷中段，留意扇形儀物與坐榻。`,speech:`這一刻，真想多留片刻。`,lead:`再尋她，看看這一次她與岸上人怎樣相對。`,result:`初見時獨立水邊，這裡又來到坐榻前。相似的髮式連起兩處身影，姿態則帶出不同時刻。`,supplement:`重複人物的指認依冠髮、衣飾與場景比對；髮式相似是線索，不能單靠它確定所有身分。`,reading:[`L7`,`C2`],comparisons:[{label:`回看初見神女`,actors:[`L1`]},{label:`回看坐榻前`,actors:[`L7`,`C2`]}],observations:[w(`hair-L7`,`坐榻前的神女髮式`,[11900,385,12080,535],`點看神女的髮式，記住雙環輪廓。`),w(`hair-L1`,`初見神女髮式`,[16960,430,17110,590],`再點初見神女的髮式，比較輪廓。`),T(`L7`,`點看神女，連著曹植的坐榻一起看。`)]},{noteTitle:`兩岸相對`,noteResult:`神女低身，曹植在岸上。`,id:`L8`,title:`相遇之後`,name:`洛神`,appearance:`再認她的眉眼與環形髮髻。`,hint:`這次她低下身，身旁有長頸鳥形。`,region:`看看送別隊伍左方、水岸附近。`,speech:`水岸相隔，話還未說盡。`,lead:`她將乘雲車離去。再認一次她的面孔。`,result:`「恨人神之道殊」：人與神的道路不同。神女低身，曹植在岸上；相遇的故事走到離別。`,supplement:`人神分離的意思來自《洛神賦》，不是單憑兩人的表情得出的結論。可分別回看兩處原畫。`,reading:[`L8`,`C3`],comparisons:[{label:`看低身神女`,actors:[`L8`]},{label:`看岸上曹植`,actors:[`C3`]}],observations:[T(`L8`,`點看神女，留意她的手臂。`),T(`C3`,`點看岸上的曹植。`)]},{noteTitle:`雲車離去`,noteResult:`神女乘雲車離去，龍形在前牽引。`,id:`L9`,title:`雲車離去`,name:`洛神`,appearance:`留意額髮與面形，別把同行者當成她。`,hint:`她與另一位人物同乘，身旁有圓形物。`,region:`往前看，留意龍形與雲車聚集的場面。`,speech:`雲車將遠，容我再回望。`,lead:`她已遠去。再尋乘舟的曹植。`,result:`神女乘上雲車，車前有龍形牽引。文字中的神話離別，在畫卷裡成了一支遠去的行列。`,supplement:`《洛神賦》寫「六龍儼其齊首」。畫中龍形互相重疊，本段著重車駕與牽引的關係，不以逐條辨數作通關條件。`,reading:[`L9`,`cloud-car`],comparisons:[{label:`看神女與雲車`,actors:[`L9`,`cloud-car`]},{label:`看車前龍形`,actors:[`dragon-link`]}],observations:[w(`cloud-car`,`雲車車體`,[6140,480,6440,665],`點看雲車，留意乘坐者與衣帶。`),w(`dragon-link`,`牽引車駕的龍形`,[5880,540,6190,780],`再看車前牽引的龍形。`)]},{noteTitle:`乘舟尋望`,noteResult:`「御輕舟而上溯」：曹植乘舟，仍在尋望。`,id:`C4`,title:`仍想再望一眼`,name:`曹植`,appearance:`比對有鬚的面孔與冠。`,hint:`他在樓船的上層，身旁另有同行者。`,region:`雲車場面以左，有一艘樓船。`,speech:`她已遠去，我仍沿水尋望。`,lead:`舟行之後，畫卷還留下了他的身影。`,result:`「御輕舟而上溯」：乘舟逆水尋望。畫中曹植在上層，舟人在下層操船；她已離去，他仍在追尋。`,supplement:`文本的「輕舟」與畫中的樓船並非精確同物；這裡連讀的是乘舟尋望的故事，不據此還原船型。`,reading:[`C4`,`boatman-left`],comparisons:[{label:`看上層曹植`,actors:[`C4`]},{label:`看下層舟人`,actors:[`boatman-left`]}],observations:[T(`C4`,`先看樓船上層的曹植。`),T(`boatman-left`,`再看下層操船的人。`),w(`boat-oar`,`船邊操船長桿`,[4160,770,4250,990],`看看舟人伸向水面的長桿。`)]}],ie=[{title:`回到岸邊`,question:`看看岸邊坐榻上的曹植。`,observation:T(`C5`,`點看岸邊坐榻上的曹植。`),result:`曹植又在岸邊出現，冠髮與鬚貌依然可認。`,supplement:`身前器物的名稱仍待核實。本段以人物與場景作觀察依據，不以未確定的器物名稱解釋故事。`},{title:`踏上歸途`,question:`看看歸途車駕的車輪。`,observation:w(`carriage-wheel`,`歸途車輪`,[1005,765,1145,990],`點看車駕的車輪。`),result:`由樓船、岸邊到車駕，旅程仍在繼續。`},{title:`足往心留`,question:`再看車中戴冠、留鬚的曹植。`,observation:T(`C6`,`點看車中的曹植。`),result:`人已上路，心仍留在洛水。反覆的身影，串起不同時刻。`}],ae=[{id:`dragon`,name:`龍形`,text:`開首可見單獨的龍形，雲車前又有龍形相連。留意它們的位置：一處伴著神女，一處牽引車駕。`},{id:`boat`,name:`舟船`,text:`上層是曹植與同行者，下層是操船的人。沿著上下兩層看，便能分清乘舟尋望與操船的不同角色。`},{id:`canopy`,name:`華蓋`,text:`隊伍上方的蓋與長柄，是找華蓋的線索。它在人間隊伍與雲車附近都出現；回看時，比較蓋的輪廓和旁邊的人。`},{id:`bird`,name:`鳥形`,text:`開首的鳥在飛，離別處的長頸鳥伴在神女身旁。比較姿態與相伴的人，再讀「翩若驚鴻」的比喻。`},{id:`ribbon`,name:`衣帶`,text:`順著衣帶看，長線隨人物回轉而彎曲。比較兩處身影，便能看出姿態的變化；衣帶的方向不等同真實風向。`},{id:`beast`,name:`神獸`,text:`雲車旁有一對淺色神獸。先看長角、伸展的四肢，再看牠們在雲水之間相伴而行；與車前的龍形比較，便能讀出離去行列中不同的形象。此處按 chievement/245842.html`}],E={"held-object-goddess":[`我在上方持物而立。`,`長長的衣帶繞在身旁。`,`同卷上下，各有相伴的身影。`],C1:[`我剛在岸上停下腳步。`,`同行的人還在我身後。`,`先看我展開的衣袖吧。`],C2:[`這一刻，我已坐在榻上。`,`面前又有神女的身影。`,`坐下來，目光仍向著她。`],C3:[`我在岸上與她相對。`,`身後的隊伍仍在這裡。`,`看看我與她之間的水岸。`],C4:[`我站在樓船的上層。`,`下面的人正在操船。`,`離開水岸，我仍在尋望。`],C5:[`我又在岸邊坐下了。`,`認得我的冠與鬚髮嗎？`,`船上之後，畫中又有我。`],C6:[`這一刻，我在車中。`,`車輪與隊伍將一同上路。`,`人已啟程，心還在洛水。`],L1:[`這是水邊初見的一刻。`,`留意我身旁延展的衣帶。`,`上方還有飛鳥與龍形。`],L2:[`看看這裡回轉的姿態。`,`衣帶隨著身形轉向。`,`和初見時的站姿比一比。`],L3:[`這裡的神女不止一位。`,`先認髮式，再比衣帶。`,`不要只靠人物的站位。`],L4:[`上方也有相伴的身影。`,`兩人的姿勢並不相同。`,`留意髮式與衣帶的輪廓。`],L5:[`柳旁還藏著回身的一刻。`,`看看頭與衣帶朝向哪裡。`,`同卷的姿態正在改變。`],L6:[`相近的身影站在一起。`,`認人時，別只看一件衣服。`,`把髮式與場面一起比對。`],L7:[`我在坐榻前又現身了。`,`和初見時的姿態比一比。`,`岸上的人也仍在這裡。`],L8:[`這一次，我低下身來。`,`身旁有長頸的鳥形。`,`再看看與我相對的岸上人。`],L9:[`這是雲車中的一刻。`,`同行者就在我的身旁。`,`車前的龍形帶著行列前進。`],"attendant-opening-left":[`我在展袖的人身旁。`,`我們的衣袖姿態不同。`,`沿著人群找找這個分別。`],"attendant-opening-rear":[`看看頭頂那片傘蓋。`,`長柄就在隊伍之中。`,`抬頭看，也能發現線索。`],"attendant-opening-beard":[`先看我的長鬚與收袖。`,`我的姿態與展袖者不同。`,`不只面孔，動作也能認人。`],"attendant-opening-middle":[`我站在同行的人群裡。`,`前後的人物互相遮擋。`,`慢慢分清各人的輪廓。`],"attendant-opening-green":[`綠色衣袍也是一條線索。`,`別漏看衣襟與袖口。`,`同一隊人，衣色各有不同。`],"attendant-opening-box":[`先看看我捧在身前的物件。`,`它和衣袖的輪廓不同。`,`隊伍裡不只有空手的人。`],"horse-keeper":[`馬匹就在我的身旁。`,`人與馬也佔著岸上一角。`,`離開主角，畫面還很熱鬧。`],"sitting-keeper":[`這裡有人蹲坐在岸邊。`,`高低不同，輪廓便不同。`,`別只找站著的人。`],"companion-L3":[`我與另一位神女相伴。`,`看看我們兩人的衣帶。`,`相似之中，也有差別。`],"companion-L4":[`這組身影在畫面上方。`,`和下方的場面分開看。`,`位置不同，未必是同一刻。`],"companion-L6":[`旁邊還有相近的身影。`,`把兩個髮式仔細比一比。`,`同伴不能直接當成主角。`],"attendant-seat-fan":[`坐榻旁有一柄扇形儀物。`,`看看扇面和長柄。`,`高處的器物也能指路。`],"attendant-seat-front":[`我在坐榻旁垂著長鬚。`,`坐著與站著的人相互映襯。`,`看看我的袖子怎樣收攏。`],"attendant-seat-green":[`這裡也有一件綠衣。`,`衣色相近，場面卻變了。`,`認人還要連著周圍看。`],"attendant-farewell-back":[`傘蓋隨著岸上的隊伍。`,`看看它在眾人上方的位置。`,`和初見時的傘蓋比一比。`],"attendant-farewell-beard":[`這段隊伍也有長鬚者。`,`先分清前後幾個人。`,`髮鬚相似，仍要看姿態。`],"attendant-farewell-box":[`我在送別隊伍裡捧著物件。`,`手邊的形狀別漏看。`,`隊伍前進，器物也相隨。`],"cloud-companion":[`我是雲車中的同行者。`,`別把同乘的人混在一起。`,`再仔細比對我們的面形。`],"cloud-driver":[`我在龍形與雲車之間。`,`順著龍身看行列的方向。`,`雲上的旅程也有前後。`],"boat-companion-one":[`我也站在樓船的上層。`,`曹植身旁不止一人。`,`先比冠髮，再看位置。`],"boat-companion-two":[`上層靠旁還有我的身影。`,`人物之間隔著船柱。`,`別把欄柱看成衣帶。`],"boatman-left":[`我在船邊握著長桿。`,`看看長桿怎樣伸向水面。`,`樓上的人與我各有位置。`],"boatman-right":[`另一邊也有人操船。`,`沿著船身找我的動作。`,`一艘船裡有不同的角色。`],"shore-attendant":[`我站在岸邊坐榻之後。`,`人物與傘柄交錯在一起。`,`先找頭部，再順著衣袍看。`],"shore-standing":[`坐候的人旁邊也有人站著。`,`一坐一立，位置便清楚了。`,`這是岸上另一刻的隊伍。`],"carriage-front":[`我在車駕前方相伴。`,`車輪與人群連成歸途。`,`看看隊伍朝哪一邊延展。`],"carriage-horse-left":[`馬上的身影在這一側。`,`人與坐騎要一起看。`,`車駕旁還有騎行的人。`],"carriage-horse-right":[`另一側也有騎者相隨。`,`看看坐騎與車駕的距離。`,`歸途不只有車中的一人。`],"carriage-driver":[`我在車馬之間。`,`長柄、車輪與馬身交錯。`,`分清器物，再看人的動作。`],"carriage-rear":[`車後還有相伴的身影。`,`別只盯著車中的面孔。`,`隊伍一直延伸到這裡。`],drummer:[`大鼓就在我的身旁。`,`先看鼓面，再看奏樂的人。`,`水上的行列也有樂聲想像。`],"wind-spirit":[`我的身影出現在雲上。`,`看看雲氣怎樣圍著身形。`,`這段畫面充滿神話想像。`],"water-attendant":[`我在水畔俯下身來。`,`姿態與站立的人不同。`,`看看手與水面的距離。`],"floating-woman":[`水上還有隨行的神女。`,`衣帶在身旁伸展。`,`主角以外，行列仍在繼續。`]};function D(e,t){let n=E[e];return n?.[Math.min(t,n.length-1)]??`再看看這一處的姿態。`}var O=2400,le=e=>Math.max(0,Math.min(1,e));function ue(e,t,n,r){let i=le(r/O);if(i===0||i===1)return{x:t,y:n};let a=Math.sin(Math.PI*i)**2;if(e===`cao`){let e=t<390?-1:+(t>570),r=le(Math.abs(t-(e<0?390:570))/300),o=Math.sin(Math.PI*le((n-390)/970))**2,s=r*r*o;return{x:t+e*68*a*s,y:n-38*a*s+14*Math.sin(Math.PI*i*2)*a*s}}let o=Math.sin(Math.PI*le((n-510)/750))**2,s=Math.sin(Math.PI*le((t-260)/490))**2;return{x:t+(460-t)*.13*o*s*a,y:n-24*o*s*a}}function k(e,t,n,r){let[i,a,o]=n,[s,c,l]=r,u=(a.x-i.x)*(o.y-i.y)-(o.x-i.x)*(a.y-i.y),d=(e,t,n)=>[((t-e)*(o.y-i.y)-(n-e)*(a.y-i.y))/u,((n-e)*(a.x-i.x)-(t-e)*(o.x-i.x))/u],[f,p]=d(s.x,c.x,l.x),[m,h]=d(s.y,c.y,l.y),g=(s.x+c.x+l.x)/3,_=(s.y+c.y+l.y)/3;e.save(),e.beginPath(),r.forEach((t,n)=>{let r=t.x-g,i=t.y-_,a=Math.hypot(r,i)||1,o=t.x+r/a*.45,s=t.y+i/a*.45;n===0?e.moveTo(o,s):e.lineTo(o,s)}),e.closePath(),e.clip(),e.transform(f,m,p,h,s.x-f*i.x-p*i.y,s.y-m*i.x-h*i.y),e.drawImage(t,0,0,1024,1536),e.restore()}function de(e,t,n,r){if(e.clearRect(0,0,1024,1536),r<=0||r>=2400){e.drawImage(t,0,0,1024,1536);return}e
