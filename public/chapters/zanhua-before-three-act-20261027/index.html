/* The same hand-painted ember supplies both discovery feedback and the collection. */
.lantern-spark-discovery {position:absolute;inset:0;z-index:17;pointer-events:none;overflow:hidden;}

.lantern-spark-discovery.is-revisit .lantern-firelight-token {width:80px;height:80px;left:-40px;top:-40px;animation:lantern-firelight-collect 900ms linear both;}
.lantern-game .lantern-journal-button.is-spark-arriving {animation:lantern-journal-receive 650ms ease both;}
@keyframes lantern-ember-away {0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}18%{opacity:.9;}100%{opacity:0;transform:translate(var(--ember-x),var(--ember-y)) rotate(var(--ember-angle)) scale(.7);}}

  65%{opacity:1;transform:translate(var(--arc-x),var(--arc-y)) scale(.72);}
  95%{opacity:1;transform:translate(var(--token-x),var(--token-y)) scale(.18);}
  100%{opacity:0;transform:translate(var(--token-x),var(--token-y)) scale(.08);}
}

:root {
  font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  color: #353c32; background: #c6b18a; font-synthesis: none;
  --paper: #f5efdf; --ink: #353c32; --green: #485a47; --red: #954c37; --line: #b8a58266;
  --motion-instant: 120ms; --motion-fast: 180ms; --motion-standard: 260ms; --motion-panel: 380ms; --motion-scene: 550ms; --motion-cinematic: 950ms;
  --ease-ui: cubic-bezier(.22,1,.36,1); --ease-soft: cubic-bezier(.33,1,.68,1); --ease-scene: cubic-bezier(.16,1,.3,1);
  --painting-grade: saturate(.68) sepia(.09) contrast(.96) brightness(1.045);
}
* {box-sizing: border-box;}
html, body, #root {margin: 0; width: 100%; height: 100%; overflow: hidden;}
body {min-width: 320px;}
button {font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
button:disabled {cursor: default;}
button:focus-visible, a:focus-visible {outline: 2px solid var(--red); outline-offset: 4px;}
button:not(.actor-hitbox) {transition: background var(--motion-fast) var(--ease-ui), opacity var(--motion-fast) var(--ease-ui);}
.sr-only {position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;}
.immersive-game {position: relative; width: 100%; height: 100%; height: 100dvh; isolation: isolate; overflow: clip;}
.scroll-frame, .scroll-viewport {position: absolute; inset: 0; width: 100%; height: 100%;}
.scroll-frame {background-color: #c6b18a; background-position: left center; background-size: cover; background-repeat: no-repeat;}
.scroll-viewport {overflow: clip; cursor: grab; touch-action: none; user-select: none; background: transparent; outline-offset: -4px;}
.scroll-viewport.is-dragging {cursor: grabbing;}
.painting-world {position: absolute; inset: 0 auto auto 0; transform-origin: 0 0; will-change: transform;}
.painting {width: 100%; height: 100%; display: block; pointer-events: none; filter: var(--painting-grade);}
.painting-detail-tile {position: absolute; top: 0; height: 100%; display: block; pointer-events: none; filter: var(--painting-grade);}
/* One movable observation area; the original painting stays intact. */
.observation-light {position: absolute; inset: 0; pointer-events: none;}
.observation-shade, .observation-warmth {position: absolute; inset: 0; pointer-events: none;}
.observation-shade {backdrop-filter: grayscale(1); -webkit-backdrop-filter: grayscale(1);}
.is-focusing .observation-shade {background: #2525251a; backdrop-filter: grayscale(1) brightness(.96); -webkit-backdrop-filter: grayscale(1) brightness(.96); mask-image: radial-gradient(circle at var(--focus-x) var(--focus-y), transparent 0, transparent calc(var(--focus-radius) * .64), #000 calc(var(--focus-radius) * 1.08)); -webkit-mask-image: radial-gradient(circle at var(--focus-x) var(--focus-y), transparent 0, transparent calc(var(--focus-radius) * .64), #000 calc(var(--focus-radius) * 1.08));}
.observation-warmth {background: radial-gradient(circle at var(--focus-x) var(--focus-y), #f8d68609 0, transparent var(--focus-radius));}
.focus-control {font-size: 12px; letter-spacing: .06em; white-space: nowrap;}
.round-control.focus-control.is-on, .round-control.focus-control.is-on:hover {background: #47573c; color: #fff3d7; box-shadow: 0 0 0 1px #f0dfae80;}
.focus-control:disabled {opacity: .4;}
.focus-instruction {position: absolute; z-index: 5; pointer-events: none; left: 50%; transform: translateX(-50%); bottom: 86px; margin: 0; font-size: 11px; letter-spacing: .08em; color: #f4ead6; text-shadow: 0 1px 5px #201f19; text-align: center; width: max-content; max-width: calc(100% - 40px);}
.focus-touch {display: none;}
@media (pointer: coarse) {.focus-desktop {display: none;}.focus-touch {display: inline;}}
.is-ready .painting {animation: painting-arrives 400ms var(--ease-soft) both;}
.scene-vignette {position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg,#2929290c,transparent 120px,transparent 80%,#1f1f1f28); box-shadow: inset 0 0 95px #29292915; transition: background var(--motion-scene);}
.ending-visible .scene-vignette {background-color: #151a160d;}
/* Keep failed-load recovery reachable above the introduction. */
.actor-hitbox {position: absolute; transform: translate(-50%,-50%); padding: 0; background: transparent; cursor: pointer;}
.actor-hitbox:focus-visible {outline: var(--outline-width,2px) dashed var(--red); outline-offset: 0; background: #f2e7c610;}
.is-dragging .actor-hitbox {cursor: grabbing;}
.scene-hud {position: absolute; z-index: 5; top: max(28px,env(safe-area-inset-top)); left: max(32px,env(safe-area-inset-left)); right: max(32px,env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; pointer-events: none;}
.mission {width: min(440px,calc(100vw - 225px)); background: #f4ebd4e8; border: 1px solid #ddcba077; border-radius: 7px; box-shadow: 0 4px 22px #46392115; backdrop-filter: blur(3px); pointer-events: auto; opacity: 0; transition: width var(--motion-panel) var(--ease-ui);}
.scene-loaded .mission {animation: paper-seen var(--motion-panel) var(--ease-ui) 300ms both;}
.mission-summary {width: 100%; display: flex; align-items: flex-start; gap: 13px; padding: 17px 18px 15px; background: transparent; text-align: left;}
.mini-seal {color: var(--red); border: 1px solid currentColor; padding: 2px 5px; font-size: 25px; line-height: 1.35; transform: rotate(-4deg); flex-shrink: 0;}
.mission-heading {flex: 1; min-width: 0;}
.mission-chapter {display: block; font-size: 11px; letter-spacing: .14em; line-height: 1.4; margin-bottom: 5px;}
.mission-heading strong {display: block; font-size: 15px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;}
.mission-objective {display: block; font-size: 10px; line-height: 1.7; margin-top: 6px;}
.mission-count {font: 18px Georgia,serif; white-space: nowrap; border-left: 1px solid #a6977880; padding-left: 16px; margin: 17px 3px 0 0;}
.mission-count b {color: var(--red); font-weight: 400;}
.mission-chevron {margin-top: 4px; flex-shrink: 0; transition: transform var(--motion-panel) var(--ease-ui);}
.mission-details {padding: 0 19px 16px 69px;}
.mission-details p {font-size: 11px; line-height: 1.9; color: #666c53; margin: 0 0 12px;}
.mission-details p:last-child {margin-bottom: 0;}
.mission-details .primary-button {font-size: 12px; min-height: 42px; padding: 10px 13px;}
.mission.is-collapsed {width: 210px;}
.is-collapsed .mission-summary {padding: 12px 15px; align-items: center;}
.is-collapsed .mini-seal {font-size: 21px;}
.is-collapsed .mission-chapter {margin: 0; font-size: 12px;}
.is-collapsed .mission-heading strong, .is-collapsed .mission-objective, .is-collapsed .mission-count {display: none;}
.is-collapsed .mission-chevron {margin: 0; transform: rotate(-90deg);}
.scene-settings {display: flex; gap: 14px; pointer-events: auto;}
.round-control {width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border-radius: 50%; background: #f5eddaed; color: #5b5e49; box-shadow: 0 1px 9px #342b1e10; opacity: 0;}
.scene-loaded .round-control {animation: soft-arrive var(--motion-fast) var(--ease-ui) 650ms both;}
.scene-loaded .round-control:nth-child(2) {animation-delay: 700ms;}
.scene-loaded .round-control:nth-child(3) {animation-delay: 750ms;}
.round-control:hover {background: #fff5dd;}
.round-control.is-on {color: #405b36;}
.settings-paper {position: absolute; z-index: 8; top: 82px; right: max(32px,env(safe-area-inset-right)); width: 210px; background: #f4ebd9f2; border: 1px solid #bcaa8477; border-radius: 5px; box-shadow: 0 8px 25px #39322025; padding: 17px; animation: paper-unfold var(--motion-panel) var(--ease-ui) both;}
.settings-paper .card-kicker {display: block; margin: 0 5px 8px;}
.settings-paper button {width: 100%; background: transparent; display: flex; align-items: center; gap: 11px; padding: 11px 5px; font-size: 12px; text-align: left;}
.settings-paper button:hover {background: #e3dfca88;}
.bottom-hud {position: absolute; z-index: 5; left: max(32px,env(safe-area-inset-left)); right: max(32px,env(safe-area-inset-right)); bottom: max(28px,env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 16px; pointer-events: none;}
.bottom-hud button {pointer-events: auto;}
.notebook-toggle {height: 46px; display: inline-flex; align-items: center; gap: 12px; padding: 0 18px; color: #f7efdb; background: #3c4935ed; border: 1px solid #e4d4ae60; border-radius: 4px; box-shadow: 0 3px 18px #282d2420; font-size: 13px; letter-spacing: .08em; opacity: 0;}
.scene-loaded .notebook-toggle {animation: soft-arrive var(--motion-panel) var(--ease-ui) 900ms both;}
.notebook-toggle:disabled {filter: saturate(.5);}
.notebook-toggle:hover:not(:disabled) {background: #303f29;}
.notebook-count {display: inline-flex; gap: 6px; font: 18px Georgia,serif; padding-left: 14px; border-left: 1px solid #e8dfcb50; animation: count-fade var(--motion-standard) var(--ease-ui);}
.notebook-count small {font-size: 13px; opacity: .75; align-self: center;}
.gesture-note {position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .07em; color: #f7efdc; text-shadow: 0 1px 5px #382f1e; display: flex; align-items: center; gap: 12px; white-space: nowrap; opacity: 0; transition: opacity var(--motion-fast) var(--ease-ui);}
.scene-loaded .gesture-note:not(.is-dismissed) {animation: soft-arrive var(--motion-panel) var(--ease-ui) 1200ms both;}
.gesture-note.is-dismissed {opacity: 0;}
.hint-button {margin-left: auto; height: 46px; display: inline-flex; align-items: center; gap: 10px; padding: 0 17px; border-radius: 24px; border: 1px solid #e8d8b655; background: #5e604cd9; color: #f4ead1; font-size: 12px; letter-spacing: .08em; opacity: .8;}
.hint-button:hover:not(:disabled) {opacity: 1; background: #565c43f2;}
.hint-button:disabled {opacity: .4;}
.character-mark {position: absolute; pointer-events: none; white-space: nowrap; font-size: 12px; padding: 7px 12px; background: #f4ebd9ee; color: #4d5540; border: 1px solid #c9b68d70; box-shadow: 0 3px 12px #39322016;}
.mark-wrong {animation: wrong-notice 1.4s var(--ease-soft) both;}
.mark-found, .mark-clue {color: var(--red); border: 1px solid currentColor; background: #f6ecd3e8; font-size: 18px; letter-spacing: .08em; padding: 5px 8px; animation: seal-seen 220ms var(--ease-soft) both;}
.mark-clue {font-size: 13px;}
.card-kicker {font-size: 10px; color: #81775e; letter-spacing: .14em;}
.primary-button {display: flex; align-items: center; justify-content: space-between; background: var(--green); color: #f7f4e9; width: 100%; padding: 13px 16px; font-size: 13px; letter-spacing: .08em; min-height: 46px;}
.primary-button:hover:not(:disabled) {background: #354b34;}
.primary-button:disabled {opacity: .5;}
.notebook-paper, .witness-paper, .reading-paper {border: 1px solid #c6b38e; color: var(--ink); padding: 29px; background: #f7f0dff7; box-shadow: 0 12px 45px #30352230; border-radius: 3px;}
.notebook-paper {position: absolute; z-index: 8; left: max(32px,env(safe-area-inset-left)); bottom: 87px; width: min(420px,calc(100% - 64px)); max-height: calc(100dvh - 120px); overflow-y: auto; animation: paper-unfold var(--motion-panel) var(--ease-ui) both; transform-origin: left bottom;}
.paper-close {position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; display: grid; place-items: center; background: transparent; color: #777b69;}
.notebook-paper h2, .witness-paper h2, .reading-paper h2 {font-size: 24px; font-weight: 500; letter-spacing: .08em; margin: 13px 0 17px;}
.journal-count {font: 13px Georgia,serif; margin-left: 12px; color: #7a8069; letter-spacing: 0;}
.clue-list {display: flex; flex-direction: column; margin: 10px 0 18px;}
.clue-card {padding: 18px 0; border-top: 1px solid var(--line); background: transparent; text-align: left; display: flex; align-items: center; gap: 14px; animation: soft-arrive var(--motion-standard) var(--ease-ui) var(--clue-delay) both;}
.clue-card:disabled {opacity: .62;}
.clue-card:hover:not(:disabled) {background: #e9e5d566;}
.painted-portrait {position: relative; display: block; width: 56px; height: 76px; flex-shrink: 0; overflow: hidden; border-radius: 2px; background: #d7c59f; mask-image: linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);}
.painted-portrait img {position: absolute; max-width: none; pointer-events: none;}
.clue-content {flex: 1; min-width: 0;}
.clue-kicker {font-size: 9px; letter-spacing: .1em; color: #818569;}
.clue-title {display: block; font-size: 14px; margin: 5px 0; letter-spacing: .05em;}
.clue-description {display: block; color: #727961; font-size: 11px; line-height: 1.9;}
.journal-objective {font-size: 11px; color: #646e53; line-height: 1.9; margin: 0;}
.journal-section-note {font-size: 12px; color: #646e53; line-height: 1.8; margin: 0 0 12px;}
.supplementary-clues {margin-top: 22px; padding-top: 19px; border-top: 1px solid var(--line);}
.supplementary-clues h3 {font-size: 16px; font-weight: 500; margin: 0 0 10px; letter-spacing: .05em;}
.supplementary-clues h3 span {display: block; margin-top: 6px; font-size: 11px; color: #646e53; letter-spacing: .02em;}
.witness-paper {position: absolute; z-index: 9; width: min(350px,calc(100% - 40px)); left: 50%; top: 50%; transform: translate(-50%,-50%); animation: soft-arrive var(--motion-standard) var(--ease-ui) both;}
.witness-paper.is-anchored {left: clamp(24px,var(--dialog-x,24px),calc(100vw - 374px)); top: clamp(94px,var(--dialog-y,120px),calc(100dvh - 330px)); transform: none;}
.witness-quote {font-size: 17px; line-height: 2; color: #626e55; border-left: 2px solid #a8b291; padding-left: 14px; margin: 0 0 24px;}
.hint-paper {position: absolute; z-index: 7; bottom: 88px; right: max(32px,env(safe-area-inset-right)); width: min(305px,calc(100% - 40px)); padding: 18px 22px; background: #f3ead7ee; border: 1px solid #c6b38e77; border-radius: 6px; box-shadow: 0 6px 25px #3f35221a; animation: paper-unfold var(--motion-panel) var(--ease-ui) both;}
.hint-paper p {font-size: 12px; color: #666e54; line-height: 1.9; margin: 8px 0 0;}
.scene-toast {position: absolute; z-index: 10; top: 165px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 11px 17px; background: #f5efdfeb; color: #4b5540; border: 1px solid var(--line); font-size: 12px; text-align: center; pointer-events: none; animation: soft-arrive var(--motion-fast) var(--ease-ui) both;}

.knowledge-sources > span {display: block; margin-bottom: 8px; color: #8a8067;}

.river-light {mix-blend-mode: soft-light;}
.river-ripples {animation: river-drift 10s linear infinite; opacity: 0;}
.ripple-1 {animation-delay: -3.3s;}.ripple-2 {animation-delay: -6.6s;}
.steam-wisp {opacity: 0; animation: steam-rise 9s var(--ease-soft) infinite;}.wisp-two {animation-delay: -4.5s;}
@keyframes painting-arrives {from {opacity: 0;} to {opacity: 1;}}
@keyframes paper-seen {from {opacity: 0; transform: translateY(-6px);} to {opacity: 1; transform: translateY(0);}}
@keyframes soft-arrive {from {opacity: 0;} to {opacity: 1;}}
@keyframes paper-unfold {from {opacity: 0; transform: translateY(12px) scale(.985);} to {opacity: 1; transform: translateY(0) scale(1);}}
@keyframes count-fade {from {opacity: .25;} to {opacity: 1;}}
@keyframes seal-seen {from {opacity: 0;} to {opacity: 1;}}
@keyframes wrong-notice {0% {opacity: 0;} 15%,75% {opacity: 1;} 100% {opacity: 0;}}
@keyframes atmosphere {0%,100% {opacity: 0;} 20%,70% {opacity: 1;}}
@keyframes river-drift {0% {opacity: 0; transform: translateX(-5px);} 30%,60% {opacity: .38;} 100% {opacity: 0; transform: translateX(8px);}}
@keyframes steam-rise {0% {opacity: 0; transform: translate(0,3px);} 25% {opacity: .22;} 70% {opacity: .12;} 100% {opacity: 0; transform: translate(6px,-18px);}}

}

.reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important;}
.reduced-motion .living-painting {display: none;}
@media (prefers-reduced-motion: reduce) {*,*::before,*::after {animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important;}.living-painting {display: none;}}

.notebook-paper.is-closing {animation: paper-fold var(--motion-panel) var(--ease-ui) both; pointer-events: none;}
@keyframes paper-fold {from {opacity: 1; transform: translateY(0) scale(1);} to {opacity: 0; transform: translateY(8px) scale(.985);}}

.phase-exploring .mission-details, .phase-complete .mission-details {display: none;}

/* Generated paper and painted raster icons replace the interface's vector art. */
.art-icon {display: inline-block; flex-shrink: 0; background-image: url('../../art/ui/painted-icons.png'); background-repeat: no-repeat; background-size: 400% 400%; vertical-align: middle; pointer-events: none;}
.art-zoom {display: inline-block; position: relative; flex-shrink: 0;}
.art-zoom b {position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 400;}
.round-control .art-icon {width: 32px !important; height: 32px !important;}
.mission, .settings-paper, .notebook-paper, .witness-paper, .reading-paper, .hint-paper, .ending-card, .notebook-toggle, .hint-button {background: #f4ead3; border: 0 solid transparent; border-image: url('../../art/ui/reading-paper.png') 180 fill / 18px / 0 stretch; backdrop-filter: none; border-radius: 2px;}
.notebook-toggle, .hint-button {color: var(--ink); opacity: 1;}
.notebook-toggle:hover:not(:disabled), .hint-button:hover:not(:disabled) {background-color: #f9efd8; filter: brightness(1.04);}
.notebook-count {border-color: #82785966;}
.notebook-toggle > .art-icon:first-child, .hint-button > .art-icon {width: 28px !important; height: 28px !important;}
.primary-button .art-icon {filter: brightness(0) invert(.94) sepia(.35);}

/* A full-page prelude opens the painting; the mission is a small in-scene control. */
.introduction {position: absolute; inset: 0; z-index: 9; color: #353b30; background: linear-gradient(90deg,#f2ead5fa 0%,#f2ead5f5 21%,#f2ead5d9 35%,#f2ead573 49%,#f2ead50a 68%,transparent 80%); transition: opacity 600ms var(--ease-scene), transform 600ms var(--ease-scene);}
.introduction.is-leaving {opacity: 0; transform: translateX(-18px); pointer-events: none;}
.intro-brand {position: absolute; top: clamp(28px,6vh,65px); left: clamp(28px,6vw,100px); display: flex; align-items: center; gap: 16px; font-size: 12px; letter-spacing: .35em; color: #646653;}
.intro-brand > span {width: 34px; height: 1px; background: currentColor; opacity: .7;}
.intro-content {position: absolute; left: clamp(28px,6vw,100px); top: 50%; transform: translateY(-50%); width: 365px; display: grid; grid-template-columns: 220px 86px; gap: 42px; align-items: center;}
.intro-title {display: flex; flex-direction: column; align-items: center; gap: 24px;}
.intro-title h1 {writing-mode: vertical-rl; text-orientation: upright; font-size: clamp(52px,5.8vw,76px); line-height: 1.05; letter-spacing: .14em; font-weight: 500; margin: 0;}
.intro-seal {border: 1px solid #9a5039; color: #9a5039; writing-mode: vertical-rl; padding: 6px 5px; font-size: 13px; letter-spacing: .18em; transform: rotate(-3deg);}
.intro-chapter {font-size: 13px; letter-spacing: .38em; margin: 0 0 32px; color: #775e45;}
.intro-story, .intro-invitation {font-size: 14px; line-height: 2.25; margin: 0 0 22px; letter-spacing: .025em;}
.intro-invitation {color: #626853;}
.intro-enter {margin-top: 24px; padding: 15px 0; display: flex; align-items: center; justify-content: space-between; gap: 25px; width: 100%; background: transparent; border-block: 1px solid #716b4f66; font-size: 19px; letter-spacing: .18em;}
.intro-enter:hover:not(:disabled) {color: #924b35; background: #fff4d126;}
.intro-enter:disabled {opacity: .45;}
.intro-play-note {display: block; margin-top: 15px; font-size: 10px; letter-spacing: .15em; color: #74745d;}
.intro-footer {position: absolute; bottom: clamp(28px,6vh,65px); left: clamp(28px,6vw,100px); margin: 0; font-size: 11px; letter-spacing: .16em; color: #75755f;}
.intro-footer p {margin: 0;}
.chapter-links {display: flex; flex-wrap: nowrap; gap: 18px; width: max-content; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; margin-top: 15px; font-size: 11px; letter-spacing: .08em;}
.chapter-links::-webkit-scrollbar {display: none;}
.chapter-links > * {flex: 0 0 auto; white-space: nowrap;}
.chapter-links a {display: inline-flex; align-items: center; gap: 7px; color: inherit; text-decoration: none; padding: 6px 0; border-bottom: 1px solid transparent;}
.chapter-links a[aria-current] {color: var(--red); border-color: currentColor;}
.chapter-links a:hover {color: var(--red);}
.chapter-links a:focus-visible {outline: 1px solid var(--red); outline-offset: 3px;}
.chapter-links a span {font-size: 9px; opacity: .65;}
.chapter-pending {display: inline-flex; align-items: center; gap: 7px; padding: 6px 0; color: #8c856f;}
.chapter-pending > span {font-size: 9px; opacity: .65;}
.settings-paper .other-chapter {display: flex; gap: 10px; align-items: center; padding: 11px 5px; margin-top: 5px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; font-size: 12px;}
.settings-paper .other-chapter:hover {color: var(--red);}
.evidence-source {display: block; font-size: 9px; color: #8b6848; margin-bottom: 5px; letter-spacing: .09em;}
.phase-intro .scroll-viewport {cursor: default;}
.phase-intro .scroll-viewport:focus {outline: none;}
.mission, .mission.is-collapsed {width: 224px; background: #f1ead7ed; border: 1px solid #c6bb9970; border-image: none; border-radius: 3px; backdrop-filter: none; box-shadow: 0 2px 15px #322b1812;}
.mission-summary, .is-collapsed .mission-summary {padding: 12px 14px; align-items: center; gap: 12px;}
.mission-chapter, .is-collapsed .mission-chapter {display: block; font-size: 13px; letter-spacing: .1em; margin: 0;}
.mission-objective, .is-collapsed .mission-objective {display: block; font-size: 9px; letter-spacing: .06em; line-height: 1.5; margin-top: 3px;}
.mission-count, .is-collapsed .mission-count {display: block; margin: 0; padding-left: 12px; font-size: 20px; border-color: #a99c7c66;}
.mission-count small {font-size: 13px;}
.mission-chevron, .is-collapsed .mission-chevron {margin: 0;}
.mission.is-expanded .mission-chevron {transform: rotate(180deg);}
.phase-exploring .mission-details, .phase-complete .mission-details {display: block; position: absolute; top: calc(100% + 9px); left: 0; width: 292px; padding: 19px 21px; background: #f1ead7f5; border: 1px solid #c6bb9970; border-radius: 3px; box-shadow: 0 3px 20px #322b1818;}
.mission-details[hidden] {display: none !important;}
.mission-details strong {display: block; font-size: 13px; font-weight: 500; margin-bottom: 12px;}
.scene-loaded .mission {animation: soft-arrive 380ms var(--ease-ui) 350ms both;}
@media (max-width: 700px) {

/* The story unfolds at the reader's pace, one short scene at a time. */
.intro-narrative {min-height: 178px;}
.intro-lines {animation: soft-arrive 260ms var(--ease-ui) both;}
.intro-story {white-space: pre-line; margin-bottom: 0;}
.intro-sequence {display: flex; align-items: center; justify-content: space-between; min-height: 36px; margin-top: 10px;}
.intro-back {padding: 8px 0; background: transparent; font-size: 10px; letter-spacing: .12em; color: #74745d;}
.intro-back:hover {color: #924b35;}
.intro-progress {display: flex; gap: 7px;}
.intro-progress span {width: 16px; height: 1px; background: #82785c45;}
.intro-progress .is-read {background: #82785cb3;}
.intro-skip {position: absolute; top: clamp(25px,6vh,62px); right: clamp(28px,5vw,80px); padding: 8px 12px; font-size: 10px; letter-spacing: .15em; color: #5b5949; background: #ede5d1b0; border-radius: 2px;}
.intro-skip:disabled {opacity: .4;}
.painted-portrait img {filter: var(--painting-grade);}
.unrecorded-clue {width: 56px; height: 76px; flex-shrink: 0; display: grid; place-items: center; border-block: 1px solid #82785c45; color: #82785c99; font-size: 21px; letter-spacing: .12em;}
.hint-stage {font-size: 10px; color: #82785c; margin-left: 12px;}
@media (max-height: 580px) {

  .intro-skip {top: 14px;}
}

.reading-paper .music-credit {font-size: 10px; line-height: 1.8; color: #82785c;}
.music-credit a {color: inherit; text-underline-offset: 3px;}

/* A single reading question, styled as a small annotation on the paper. */
.knowledge-quiz {margin-top: 25px; padding: 20px 0 5px; border-top: 1px solid var(--line);}
.knowledge-quiz fieldset {border: 0; padding: 0; margin: 13px 0 16px; min-width: 0;}
.knowledge-quiz legend {font-size: 15px; line-height: 1.9; margin-bottom: 14px; color: var(--ink);}
.quiz-option {display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 12px 10px; margin: 7px 0; border: 1px solid #95896b45; background: #fffaf029; cursor: pointer; font-size: 12px; line-height: 1.8;}
.quiz-option:hover {background: #e9e5d566;}
.quiz-option.is-selected {border-color: #69745f; background: #e3e6d685;}
.quiz-option input {accent-color: var(--green); flex-shrink: 0; width: 16px; height: 16px; margin: 0;}
.quiz-option:has(input:focus-visible) {outline: 2px solid var(--red); outline-offset: 2px;}
.quiz-letter {color: #897755; flex-shrink: 0;}
.knowledge-quiz fieldset:disabled .quiz-option {cursor: default;}
.quiz-feedback {border-left: 2px solid #a27b4d; padding: 10px 14px; margin: 12px 0 18px; background: #d9c59424;}
.quiz-feedback.is-correct {border-color: #687659; background: #c2cfb229;}
.quiz-feedback strong {font-size: 12px; font-weight: 500; color: #785f3e;}
.quiz-feedback.is-correct strong {color: #4c6144;}
.reading-paper .quiz-feedback p {font-size: 12px; line-height: 1.9; margin: 6px 0 0;}
.reading-paper .quiz-note {font-size: 10px; color: #827b64; line-height: 1.8; margin: 10px 0 0;}

/* The target portrait appears only before entering the painting. */

.memory-mission .mission-summary {padding: 13px 15px; gap: 10px; align-items: flex-start;}
.memory-mission .mission-chapter {font-size: 14px; line-height: 1.6; letter-spacing: .04em;}
.memory-mission .mission-objective {display: block; font-size: 13px; letter-spacing: 0; line-height: 1.7; margin-top: 5px;}
.memory-mission .mission-details {width: 100%; padding: 19px 21px;}
.memory-mission .mission-details p {font-size: 13px; line-height: 1.9;}
.intro-reference {display: flex; align-items: center; gap: 13px; margin-top: 16px;}
.intro-target-cutout {display: block; position: relative; width: 112px; height: 168px; flex: 0 0 auto; overflow: hidden; background: transparent;}
.intro-target-cutout img {position: absolute; left: 50%; top: 50%; height: 114%; width: auto; max-width: none; transform: translate(-50%, -50%);}

.hint-paper p {font-size: 14px; line-height: 1.9; color: #485a47;}
.clue-card:not(.is-collected):not(:disabled) {cursor: pointer; opacity: 1;}
.clue-card:not(.is-collected):not(:disabled):hover {background: #d9c59424;}
.journal-section-note {font-size: 13px; line-height: 1.9;}
@media (max-width: 700px) {

  .memory-mission .mission-summary {padding: 10px 12px;}
  .memory-mission .mission-objective {font-size: 12px;}
  .memory-mission .mission-details {width: min(310px,calc(100vw - 36px));}
  .intro-target-cutout {width: 84px; height: 126px;}

.knowledge-stage h2:focus {outline: none;}
.stage-question .knowledge-quiz {border-top: 0; padding-top: 0; margin-top: 0;}
.knowledge-back {display: block; padding: 12px 0; margin: 6px 0 12px; background: transparent; color: #72765e; font-size: 12px; text-decoration: underline; text-underline-offset: 4px;}
.knowledge-back:hover {color: var(--red);}

/* A quiet silk bridge between chapter covers, shared by both document runtimes. */
html,body{background-color:#f1ead7}
/* Keep a cross-document arrival on silk while its inline runtime is parsed. */
html:not(.chapter-motion-ready)::after{content:'';position:fixed;inset:0;z-index:2147483000;background:#f1ead7;pointer-events:none}
.chapter-transition-veil{position:fixed;inset:0;z-index:2147483000;pointer-events:none;opacity:0;background:#f1ead7;contain:strict}
.chapter-transition-veil.is-blocking{pointer-events:auto;touch-action:none}
/* The chapter veil owns arrival; a second painting fade changes the backdrop. */

榜牆前，人聲漸起。`,action:`走進此日`},{title:`人潮之中`,text:`書童回過頭，
同行的考生已不見蹤影。`,action:`聽他的委託`},{title:`記住這個人`,text:`「請替我找到圖片中的考生。」
他穿青衫，帶着方形書箱。`,action:`記住了，開始尋人`}],footer:`一卷市井，藏着一場相逢。`,mission:`替書童尋回考生`,evidenceWord:`線索`,targetDescription:`青色長衫，帶着方形書箱。`,targetPortrait:w(`art/portraits/scholar-cutout-v1.png`),initialRegion:{x:.7,y:.5},instruction:`回想開始前的人物圖，左右拖曳、放大畫卷，找到後點選他。找不到時按「看看提示」，也可以向畫中人問訊。`,objectives:{exploring:`回想剛才的人物圖，找回考生，找到便可完成。問訊與線索都可選，不必收齊。`,complete:`書童與考生，終於相逢。`},guide:`開始前先看清考生的人物圖，準備好才按「記住了，開始尋人」。入畫後人物圖會收起，請回想他的樣子，找到後點選便完成，無需收集線索。找不到時，可按「看看提示」逐步查看文字描述、地標與區域，也可向抄榜人、榜前圍觀者或茶攤掌櫃問訊。預設凝神模式可自行移動觀察範圍，仔細看畫中人物與細節；覺得太難可按右上「彩色」轉為全彩，亦可再切回凝神；所有問訊和觀察都是可選的幫助。`,alt:`原創科舉放榜日全景古畫，左側榜牆、中央茶攤、右側橋頭與人群`,endingTitle:`人海相逢`,knowledgeLabel:`科舉小知識`,knowledge:{title:`「金榜題名」的榜，寫了甚麼？`,scope:`以清代殿試為例`,paragraphs:[`在清代，殿試是科舉考試的最高一級。考生的名次確定後，會寫入金榜，公布考試結果。`,`金榜把錄取者分為三甲。一甲只有三人，依次俗稱狀元、榜眼、探花；二甲與三甲也在榜上，考中者統稱進士。`,`所以，「金榜題名」不只指考中狀元，也包含榜上其他進士。不同朝代、不同級別的考試，制度和稱號會有差異。`],note:`本關城市、人物與尋人故事均為虛構，畫風參照《清明上河圖》。以上以清代制度作文化補充，並非對畫中事件的歷史還原。`,question:{prompt:`依照文章，哪一項對「金榜題名」的理解正確？`,options:[`只有考中狀元才算金榜題名`,`榜上錄取的進士都算金榜題名`,`參加殿試就算金榜題名`],correctIndex:1,explanation:`金榜包括一甲、二甲與三甲的錄取者，所以「金榜題名」也包含榜上其他進士。`,retryHints:[`再看看第二、三段：一甲之外，二甲與三甲也列在金榜上。`,``,`金榜公布錄取結果。想想「參加考試」與「榜上有名」是否相同。`]},sources:[{title:`故宮博物院｜清代殿試`,url:`https://www.dpm.org.cn/court/system/236363.html`},{title:`文化部文化資產局｜清朝科舉考試金榜`,url:`https://twh.boch.gov.tw/world-memory/detail.aspx?id=994`}]},steam:{x:.406,y:.273},hints:{copyist:{messages:[`忙於記錄的人，或許比匆匆過客更留意身旁。`,`榜文附近，除了抬頭張望的人，也有人低頭忙碌。`,`已展開榜牆一帶。留意正伏案持筆的人。`],region:{x:.14,y:.43}},"tea-keeper":{messages:[`買茶的人歇腳時，掌櫃也留意了他們的行李。`,`沿街看看茶攤，找一位正在招呼客人的掌櫃。`,`已展開茶攤一帶。問問掌櫃，聽聽考生隨身帶着甚麼。`],region:{x:.47,y:.49}},"board-observer":{messages:[`擠在人潮裏的人，或許聽過別人離開前說的話。`,`榜牆前有人忙着記錄，也有人一邊看、一邊與旁人交談。`,`已展開看榜的人群。留意榜文右端、舉手的赭衣人。`],region:{x:.23,y:.29}},"scholar-target":{messages:[`還記得剛才的考生嗎？他穿青色長衫，身旁有一只方形書箱。`,`往畫卷右側找找。他在有石欄的橋邊等候，留意附近穿青衫的人。`,`已帶你到石橋一帶。找找穿青衫、帶着方形書箱的人，再點選他。`],region:{x:.84,y:.55}}}}},D=e=>`#examination`,O=[{id:`zanhua`,title:`簪花仕女圖`,painting:`傳唐代周昉作 · 簪花仕女圖`,href:`#zanhua`,status:`已完成`,description:`尋找三位女子，從逗犬、持花與簪花，細看盛裝與不同的畫中生活。`,image:w 色裙腰束在胸際，並非通常想像的腰部。下方長裙與外層紗衣分開描繪；這是畫中盛裝的線索，不能當作所有唐代女子的日常穿法。`),Te=Se(`scarf`,`花紋披帛`,[3240,780],`披帛是繞在肩臂間的長帶，向下垂落，並不是另一隻衣袖。沿着花紋追看它的走向，再與有袖口的紗衣比較。`),Ee=Se(`skirt`,`曳地長裙`,[3420,1300],`裙襬延伸到地面，與薄紗外衣疊在一起。寬袖、長裙、披帛共同構成這身盛裝；不能只用一件衣服的名字概括全部。`),De=[[[Se(`red-skirt`,`紅色裙襬`,[5330,1190],`深色外衣之外露出紅裙，裙襬向地面鋪開。先分辨內層裙色，再看外層衣線，便能讀出盛裝的疊穿。`),Se(`dark-gauze`,`寬袖外衣`,[5850,755],`外衣有寬大的袖部，與內層紅裙並非同一件衣物。畫中女子的遊賞裝束，與侍女的執扇身分還需並看。`)]],[[we,Ce,Te],[Te,Ce,Ee],[Se(`ribbon`,`紅帶束髻`,[3715,460],`紅帛約束雙髻，與其餘女子的高髻、簪花和金飾不同。較簡的束髮配合執扇動作，表現隨侍角色；紅色本身不能視作侍女專用的制度。`,1),Se(`fan`,`長柄扇`,[4050,510],`扇面與長柄連起雙手的姿勢。比較手中花與手中扇，才能看出遊賞者和侍奉者的差別。`)]],[[Se(`high-hair`,`高髻`,[1215,205],`高髻把頭部輪廓向上延伸。館方介紹指出，這類高髻可能藉「義髻」增加高度；它不只是把全部真髮盤得更高。`,0),Se(`hair-flower`,`髻上簪花`,[1350,66],`大朵花飾位於髻上，與髮髻和細小飾物疊在一起。這裡先辨認簪花的位置，不憑複製圖強定花種。`,0),Se(`hair-ornament`,`金色髮飾`,[1350,160],`高髻旁可見金色細線的裝飾。這是原畫中的顏色線索；單憑畫面，不能確定器物材質或每件飾物的名稱。`,0)],b.map(e=>Se(e.id,e.label,e.at,`印章會留下收藏與鑑賞的痕跡。沿着這類線索與著錄，可追看畫卷先後為梁清標、安岐及清內府收藏的歷史。眼前的紅印不是畫中女子的姓名，也不是畫家落款。`,0))]],Oe=Se(`seal`,`更早的收藏線索`,y.at,`畫心左下另有較淡的「紹興」連珠印。館方以它說明畫卷曾入藏南宋高宗內府。它把畫卷的收藏歷史帶到南宋；印記記下的是收藏，並不是女子的姓名。`,0),ke={id:`tang-dress`,label:`唐代女服的不同面貌`,at:[3090,480],body:`唐代女服並非只有寬袖長裙。國博展覽也呈現窄袖襦衫配裙、披帛，以及胡服、男裝等形象。衣着隨身分、場合與時期改變；本幅可作貴族盛裝的線索，不能概括所有唐代婦女。`,source:5},Ae=(e,t,n)=>({...De[e].flat().find(e=>e.id===t),path:n,layer:t===`waist`||t===`skirt`||t===`red-skirt`?`skirt`:t===`scarf`?`scarf`:`gown`}),je=[{name:`逗犬女子`,title:`紅裙之外，還有幾層？`,image:`art/zanhua/studies/P1-dress-study-v1.png`,original:`art/zanhua/studies/P1-dress-original.png`,width:968,height:1625,atlas:`art/zanhua/studies/P1-dress-layers-v1.png`,atlasWidth:1942,atlasHeight:809,layers:[],parts:[{...Ae(0,`dark-gauze`,`M 705 645 Q 838 628 892 701 L 952 1300 Q 971 1450 895 1455 L 861 1160 811 895 750 780 Q 676 865 613 1060 L 435 1456 Q 351 1535 292 1450 L 270 1360 458 1125 553 758 Z`),hitPath:`M 490 1050 L 640 1010 520 1250 342 1420 310 1380 Z`},Ae(0,`red-skirt`,`M 269 1330 L 300 1460 Q 367 1540 549 1455 L 392 1540 Q 141 1578 12 1500 L 16 1457 Q 135 1380 269 1330 Z`),{id:`flora g-their-hair-with-flowers-zhou-fang/sgEnDl0cAnX9GQ?hl=zh-tw`,label:`作品資料與年代討論`},{url:`https://www.chnmuseum.cn/yj/xscg/xslw/201812/t20181224_33161.shtml`,label:`中國國家博物館：唐代女服的變化`},{url:`https://www.chnmuseum.cn/Portals/0/web/zt/20180904dtfh/`,label:`中國國家博物館：大唐風華・長安多麗人`}],Re=e=>({points:e.map(([e,t])=>({x:e/6455,y:t/1378}))}),ze=(e,t,n,r,i,a,o,s=1.15,c)=>({title:e,prompt:t,action:n,answer:r,region:Re(i),focus:{x:a[0]/6455,y:a[1]/1378},source:o,ratio:s,collect:c}),Be=[[ze(`逗犬之外，還看見怎樣的盛裝？`,`沿着深色外衣往下看，腳邊露出一抹紅色。輕點拖在地上的紅裙。`,`點擊逗犬女子的紅色裙襬`,`紅裙一直曳到地面，外面另罩寬袖紗衣。畫中的貴族女子以多層衣飾盛裝遊賞；這一刻的閒趣，並不代表當時所有婦女的日常。`,[[5180,1128],[5310,1075],[5420,1120],[5485,1225],[5320,1255],[5165,1220]],[5410,1070],1,.95)],[ze(`薄衣之內，長裙從哪裡束起？`,`肩臂仍透過紗衣看得見。再看胸前那片紅色：輕點長裙的高裙腰。`,`點擊持花女子胸前的紅色裙腰`,`裙腰高束在胸際，長裙向下垂至地面；寬袖紗衣罩在外層。外衣、裙子與手臂的線條疊在一起，才有眼前這種輕薄而繁複的裝束。`,[[3050,438],[3135,455],[3130,528],[3060,527]],[3165,500],1),ze(`這條花紋長帶，也是衣袖嗎？`,`看她肩臂外側，還有一條帶花紋、向下垂的長帶。點點這件衣飾。`,`點擊持花女子臂旁的花紋披帛`,`披在肩臂間的是披帛，有袖口的才是外衣。唐初女服多較窄狹，中晚唐衣袖與裙幅漸寬。把眼前的披帛、寬袖和曳地裙分開看，盛裝的層次與時代趣味便一起浮現。`,[[3200,530],[3250,515],[3270,720],[3245,985],[3265,1105],[3200,1080]],[3250,785],4,1),ze(`誰在賞花，誰的手還忙着？`,`輕點侍女的扇面，再比較兩人的髮髻與手中物。`,`點擊侍女手中的扇面`,`紅帛用來約束侍女的雙髻，其餘女子則以高髻、簪花與金飾盛裝。較簡的束髮配合執扇的動作，表現她在旁侍奉的角色；不能據此斷定紅色是侍女專用的規定。`,[[3855,500],[3890,440],[3980,390],[4075,395],[4155,450],[4160,520],[4130,580],[4050,625],[3960,630],[3875,585]],[3890,580],1,.95,`fan-maid`)],[ze(`花朵之下，髮髻怎會這樣高？`,`花之外，盤起的頭髮也高高聳起。輕點髮髻，看看這份盛裝如何把目光引向頭部。`,`點擊斜首女子的高髻`,`館方介紹以「義髻」解釋這類高髻：用墊髮等方式增加高度。高髻再配簪花與金色髮飾，讓頭部也成為盛裝的一部分。`,[[1160,120],[1260,90],[1400,115],[1435,200],[1370,265],[1180,285],[1135,240]],[1300,220],0),ze(`誰曾把這幅畫珍藏起來？`,`看畫卷左邊的淺色裝裱，上下排着三枚清楚的紅印。輕點其中一枚，找找昔日收藏者留下的痕跡。`,`點擊左邊裝裱上的任一枚收藏印`,`這些紅印是後來鑑賞、收藏留下的痕跡。館方記載，畫卷曾先後為梁清標、安岐收藏，乾隆年間收入清內府。紅印帶我們認識畫卷的流傳，卻不能代替畫中女子的姓名或畫家落款。`,[[319,906],[409,906],[409,1239],[319,1239]],[364,1073],0,1.35)]],Ve=[[{speaker:`P1`,invite:`牠總盯着我的手。你呢？沿着我的外衣往下看，可見裙子露出了甚麼顏色？`,reply:[`紅裙從外衣底下露出來了。這回分得清裡外了嗎？`,`衣裳一層層，手卻只動一下。牠已經等不及了。`],history:[`這是畫中貴族女子盛裝遊賞的片刻，不能代表所有唐代婦女的日常。`]}],[{speaker:`P4`,invite:`隔着紗衣，還看得見手臂。再看看胸前的紅色：你猜長裙從哪裡束起？`,reply:[`紅色長裙束得高，外面還罩着薄紗。你看清那幾道衣線了嗎？`,`分開看是幾件衣物，合在一起，才是眼前這身盛裝。`],history:[]},{speaker:`P4`,invite:`衣袖分清了，肩臂旁這條花紋長帶呢？它也有袖口嗎？`,reply:[`它是披帛，繞在肩臂間；衣袖則屬於外罩的紗衣。`,`我的手伸出去拈花，衣袖與披帛便交疊在一起。`],history:[`唐初女服多較窄狹，中晚唐的衣袖與裙幅漸寬。畫中這身盛裝，也讓我們看見當時衣飾的審美趣味。`]},{speaker:`P3`,invite:`她有花在手，我的手可沒閒着。看看我拿的是甚麼，再看看我的髮髻。`,reply:[`是扇。紅帶束着我的雙髻，她們卻在高髻上簪花。`,`她們拈花遊賞，我執扇隨侍。同在畫裡，忙的事可不同。`],history:[`紅帛用來約束雙髻。較簡的束髮與執扇動作相配，表現隨侍角色；其餘女子則以高髻、簪花與金飾盛裝。`,`這是畫中的裝束對比，不能據此斷定紅色是侍女專用的規定；現有資料沒有交代她為何選用紅色。`]}],[{speaker:`P6`,invite:`你認得花，可留意過花下面的頭髮？這髮髻為何能盤得這樣高？先點點看。`,reply:[`花在上，細飾點在髻邊。現在再看我，可還只留意那朵花？`],history:[`館方以「義髻」解釋這類高髻：用墊髮等方式增加高度。盛裝的線索，並不只在衣裳。`]},{speaker:`P6`,invite:`你看出了我的妝點，卻還不知道我的姓名。看看左邊裝裱上清楚的紅印：會是誰留下的？`,reply:[`印記留在畫卷上，記下的是後來珍藏、鑑賞它的痕跡。可別把它當成我的名字。`],history:[`收藏者會在書畫上留下鑑藏印。依館方記載，這幅畫曾先後為梁清標、安岐收藏，乾隆年間收入清內府。`,`畫中女子的姓名仍不見記載，本幅也沒有畫家落款。後世依著錄與風格繫於周昉，但作者與成畫年代仍有討論，所以稱「傳周昉作」。`]}]],He=[`牠仰頭追着長柄，我也垂眼望牠。畫裡只留下一刻，你卻能猜到下一步，對嗎？`,`我手裡拿的是花，身上的穿戴卻也不止一層。陪我分清，再看看旁人的手。`,`從衣袖看到頭上了？花、高髻與細飾，也有前後層次。可這些，能告訴你我的名字嗎？`],Ue={width:6455,height:1378},We=w(`art/zanhua/full-scroll.jpg`),Ge=`https://commons.wikimedia.org/wiki/File:Zhou_Fang._Court_Ladies_Wearing_Flowered_Headdresses._(46x180)_Liaoning_Provincial_Museum,_Shenyang..jpg`,Ke=(e,t,n)=>({id:e,name:t,kind:`candidate`,x:(n[0]+n[2])/2/6455,y:(n[1]+n[3])/2/1378,width:(n[2]-n[0])/6455,height:(n[3]-n[1])/1378}),qe=[Ke(`P1`,`垂首的女子`,[5330,95,5910,1255]),Ke(`P2`,`抬手的女子`,[4210,70,4850,1350]),Ke(`P3`,`執扇侍女`,[3530,390,3915,1360]),Ke(`P4`,`持花的女子`,[2820,85,3520,1340]),Ke(`P5`,`紅衣女子`,[1645,255,2130,1100]),Ke(`P6`,`斜首的女子`,[950,100,1680,1360])],Je=Object.fromEntries([[`P1`,5644,350],[`P2`,4622,327],[`P3`,3715,589],[`P4`,3079,319],[`P5`,1807,418],[`P6`,1240,340]].map(([e,t,n])=>[e,{x:Number(t)/6455,y:Number(n)/1378}])),Ye=[[5440,40,5830,450],[4400,30,4810,440],[3590,345,3890,675],[2920,0,3330,440],[1740,145,2e3,495],[1080,10,1530,460]].map(([e,t,n,r])=>({x:e/6455,y:t/1378,width:(n-e)/6455,height:(r-t)/1378})),Xe={P1:[`你看我的頭花，牠卻只看我的手。`,`我只動一下，牠便追了過來。`,`牠張着嘴，像要接住甚麼？`],P2:[`花要簪得穩，袖子也得理一理。`,`你先看見花，還是衣上的大紋樣？`,`同樣是盛裝，細節卻各有不同。`],P3:[`你們賞花，我手裡還有扇呢。`,`她們的花髻，和我的髮式可不同。`,`有人閒遊，也有人在旁侍候。`],P4:[`薄薄一層，可還藏着不少線條。`,`我手裡的花，和髻上的可不同。`,`看見我的盛裝，也看看旁人的忙碌。`],P5:[`畫得小，就一定站得遠嗎？`,`我的紅衣，隔着畫卷也看得見吧？`,`別急着猜我的名字，畫裡沒有寫呢。`],P6:[`只憑這朵花，你能認出我嗎？`,`我們都簪花，髮飾卻各不相同。`,`認得我的樣貌，未必知道我的身世。`]},Ze=e=>({points:e.map(([e,t])=>({x:e/6455,y:t/1378}))}),Qe=[{id:`P1`,portrait:w(`art/zanhua/portraits/P1-head-v2.png`),appearance:`她垂着頭，臉朝左下方。`,hints:[`她身穿深色外衣，手中拿着一件長柄物。`,`往畫卷的右半部找找。`],district:.76,found:`噓，別讓牠發現我把手停住了。`,near:`誰在追着她的手？`,title:`一幅靜畫，怎會有動作？`,prompt:`她的手伸向何處？

5,100,230,`後排綠衣人`,`從人縫裡也看得見。`,`前頭的人可真專心。`,`你找到那雙眉眼了嗎？`],[1160,420,110,240,`右側紅衣人`,`這邊站着也熱鬧。`,`瞧，大家朝着同一邊看。`,`我的目光沒離開過呢。`],[1250,410,80,240,`右緣藍衣人`,`我在旁邊瞧瞧就好。`,`你可把這一排看齊了？`,`再往旁邊探一探吧。`],[800,800,150,260,`抱筒紅衣人`,`抱着這些，兩手都忙。`,`一節一節的，你數過嗎？`,`等我把它們抱穩了。`],[920,755,130,275,`旁觀綠衣人`,`我正看他手裡那些。`,`他的懷裡都快滿了。`,`熱鬧也藏在小物裡呀。`],[200,1130,125,260,`下方紅衣人`,`我也在等下一陣熱鬧。`,`你看見旁邊那位了嗎？`,`我這兒可沒走開呢。`],[290,1070,130,270,`下方藍衣人`,`尋人也得慢慢看。`,`先認眉眼，再看鬍鬚。`,`咦，你已經來過了。`]]),qt(16,[[55,625,80,210,`門邊藍衣人`,`站在門邊，也看得清。`,`門外的人都朝哪兒走？`,`你還沒把這兒看完吧。`],[105,660,70,210,`門邊紅衣人`,`我讓出一點位置給你。`,`這扇門裡外都有看頭。`,`你又回到門邊啦。`],[620,1120,140,290,`推車藍衣人`,`讓一讓，這車可不小。`,`車上擺的東西看清沒？`,`我的手還得扶着車呢。`],[45,1250,85,240,`車旁紅衣人`,`你也來看看這輛車？`,`別漏了車上那些小物。`,`看車，也看看推車的人。`]]),qt(6,[[800,400,100,270,`門內捧物藍衣人`,`先讓我把這個捧穩。`,`雙手捧着，可馬虎不得。`,`你又來看我手裡啦。`],[730,470,80,240,`門側藍衣人`,`門裡也有我們忙着。`,`你從這邊望進來看看。`,`我就在門旁陪着呢。`],[1e3,575,140,280,`帳幔旁紅衣人`,`帳幔這邊也有人看。`,`你的目光到庭前去了？`,`好戲還在前頭呀。`],[765,910,110,270,`中排紅衣人`,`我也想看清這場戲。`,`留意旁人看的方向。`,`你比我還專心呢。`],[820,805,90,230,`中排藍灰衣人`,`我站後頭也看得見。`,`別只盯着最前面呀。`,`大家都看得入神了。`],[885,865,115,260,`中排側身紅衣人`,`換個方向，看看庭前。`,`你看我正朝着哪邊？`,`我還捨不得轉過頭呢。`],[1060,875,125,270,`右側紅衣人`,`這場熱鬧我可要看完。`,`你先看看他們的動作。`,`一個姿勢也別漏了。`],[1150,770,95,230,`右側藍衣人`,`我在後面陪着看。`,`前排的帽子都不一樣。`,`可別只憑衣裳認人呀。`],[1170,900,110,250,`右側轉身紅衣人`,`我轉過來看個仔細。`,`你也跟着我的目光看？`,`這裡真是看不夠呢。`],[110,1120,95,250,`下方揚手藍衣人`,`看這邊，我都舉手了。`,`你留意到我的手勢嗎？`,`我還想再湊近些呢。`],[245,1350,105,260,`燈旁藍衣人`,`這盞燈就在我們旁邊。`,`燈上也有精細的線條。`,`你也喜歡看燈嗎？`],[310,1290,110,250,`指燈紅衣人`,`我指的可在這一頭。`,`跟着我的手看看呀。`,`小小的燈也值得細看。`],[755,1370,125,230,`下方紅衣旁觀者`,`我離表演又近了一點。`,`他們配合得真好。`,`你最喜歡哪個動作？`]]),qt(13,[[50,285,85,240,`上方紅衣持竿人`,`這根竿子長得很呢。`,`眼睛也往竿頭看看。`,`我得一直扶穩它。`],[80,1e3,80,220,`左側倒立者`,`你看，我倒過來了！`,`手臂可得撐得穩。`,`別眨眼，再看一回。`],[300,1030,110,230,`藍衣吹奏者`,`我給這場戲添個聲。`,`瞧瞧我嘴邊的小物。`,`手指也得跟得上呢。`],[485,1030,120,240,`綠衣持旗者`,`旗子這一端由我扶。`,`長竿一直伸到上頭。`,`拿穩竿子才好看戲。`],[590,1200,120,250,`紅衣持幡者`,`這面幡也來湊熱鬧。`,`你看它上面的花樣。`,`我的手可沒閒着呢。`],[725,1270,105,230,`下方藍衣鼓手`,`我也來接上這一拍。`,`鼓槌就在我手裡。`,`下一拍又要來啦。`],[130,1300,110,240,`左下藍衣鼓手`,`這邊也有鼓聲呀。`,`看見我手裡的鼓了？`,`大家一同把節拍接上。`],[205,1220,95,240,`紅衣吹奏者`,`我吹着，你慢慢看。`,`留意我兩手的位置。`,`這場好戲還有我們呢。`],[290,1300,100,230,`綠衣吹奏者`,`我和旁邊那位一起演。`,`我們拿的東西相似吧？`,`再看看兩人的姿勢。`],[925,850,85,160,`竿頂童子`,`我在高處也站得住！`,`你看到下面的搭檔嗎？`,`上下都得配合呀。`],[900,1270,220,110,`桌上托竿表演者`,`別只看上頭，還有我。`,`長竿得從這裡托穩。`,`上下兩人缺一不可呢。`],[1110,1280,105,220,`右下紅衣鼓手`,`好戲也得配上鼓點。`,`我的槌還舉着呢。`,`你都看到這一頭啦。`],[1220,1180,90,210,`右側綠衣持竿人`,`這面旗我也扶着呢。`,`順着竿子往上看。`,`你認得幾面旗了？`]]),qt(11,[[1095,580,110,240,`上方藍衣人`,`我陪着旁邊的人看燈。`,`你看那盞燈像甚麼？`,`花燈可有各種模樣。`],[1180,650,115,230,`上方紅衣人`,`孩子們的燈真有趣。`,`看看燈是怎樣提着的。`,`每一盞都不一樣呢。`],[1250,680,60,110,`右側小童`,`也看看我手裡嘛。`,`我沒有站得很遠呀。`,`你這回看見我了！`],[920,795,120,170,`提蟹形燈童子`,`我這個有好多隻腳。`,`仔細數數它的腳呀。`,`可別把它認成魚兒。`],[1040,860,100,160,`提兔形燈童子`,`我的兔子不會跑走。`,`看那兩隻長耳朵！`,`我可一直提着它呢。`],[195,1130,95,210,`左下紅衣持幡者`,`這面幡跟着我走。`,`竿頭的小樣看見了？`,`我也是這場戲的一員。`],[315,1215,110,210,`俯身綠衣人`,`我正顧着手裡的呢。`,`彎下身才拿得穩呀。`,`先讓我把這個放好。`],[395,1180,95,210,`持燈深衣人`,`兩邊的燈都要拿穩。`,`你先看哪一邊呢？`,`兩頭都看，才不會漏。`],[685,1070,95,210,`後排持杖綠衣人`,`我的裝扮認得出嗎？`,`別漏了我手裡這根杖。`,`再看看旁人的面貌。`],[670,1215,110,150,`前排矮身演出者`,`低一點，也能演好戲。`,`你看到我的姿勢了？`,`我可不是躲起來呀。`],[810,1120,125,240,`藍衣長鬚演出者`,`這副長鬚夠有氣勢吧？`,`先看臉，再看手中物。`,`可別認錯這副裝扮。`],[940,1135,95,210,`綠面紅衣持杖者`,`我這張臉很特別吧？`,`看看旁人的臉，像我嗎？`,`我的杖也別漏看呀。`],[1090,1125,120,230,`綠衣持幡長鬚者`,`長鬚和幡，我都有呢。`,`你只顧着看我的鬍鬚？`,`我也在和大家一起演。`],[1190,1220,95,230,`藍衣紅領演出者`,`我就在隊伍這一端。`,`你看我們站得多近。`,`這場戲也有我一份。`],[1250,1080,80,230,`右緣綠衣演出者`,`看過前頭，也看看我。`,`我還拿着一件東西呢。`,`你把這隊人看齊了？`]]),qt(3,[[240,1250,125,230,`左側長鬚褐衣人`,`我也來陪着看這場戲。`,`別把長鬚當成同一人。`,`眉眼也要仔細比對。`],[540,1250,175,260,`白馬道具綠衣演出者`,`瞧瞧我這匹白馬。`,`人和馬是怎樣連着的？`,`再看我的腿在哪裡。`],[770,1060,145,250,`舉械綠衣演出者`,`這個架勢可得擺好。`,`你看到我舉起的手嗎？`,`看手，也看看腳下呀。`],[915,1300,165,200,`黑馬道具深衣演出者`,`我的馬也是戲中一員。`,`別漏了馬旁邊的人腿。`,`看清裝扮，就更有趣。`],[1170,1190,155,260,`褐馬道具黃衣演出者`,`我也騎着馬來啦。`,`這一匹和白馬不同吧？`,`幾匹馬都有自己的樣子。`],[1040,1e3,115,230,`門階藍衣樂人`,`我在台階上配合他們。`,`手裡的圓盤看見沒？`,`熱鬧也得有人伴奏呀。`]]),qt(7,[[800,250,165,285,`上方拱手紅衣人`,`我在燈旁也看得入神。`,`別漏了燈桿上的花樣。`,`你又來看這一邊啦。`],[980,270,100,220,`上方紅衣童子`,`我跟着大人一起來。`,`這兒的燈可真高呀。`,`你找到要找的人了嗎？`],[1100,250,150,290,`上方綠衣持物者`,`我還拿着東西呢。`,`看看我兩手的姿勢。`,`先讓我拿穩再說呀。`],[125,1110,130,260,`左側綠衣持竿者`,`這根長竿由我扶着。`,`竿頭也值得看一眼。`,`你有順着竿子找嗎？`],[155,1270,145,250,`左下藍衣持物者`,`這一頭還有我忙着。`,`我兩手各在做甚麼？`,`再看看旁邊那盞圓燈。`],[460,1175,150,250,`綠衣鼓手`,`我的鼓點也在這裡。`,`鼓面和鼓槌看清沒？`,`等我接好下一聲。`],[535,1100,100,210,`鼓手後方藍衣人`,`站在鼓後也看得見。`,`前面的手勢真熱鬧。`,`別把後排的人漏了。`],[620,1110,130,250,`綠衣揚手者`,`我把手抬得高些。`,`這個動作你留意了嗎？`,`看戲也要跟上拍子呀。`],[800,1100,150,280,`袒腹黃衣演出者`,`看我這一身裝扮！`,`我的肚子也來湊熱鬧。`,`你是不是認得這張笑臉？`],[815,1270,190,240,`抬腿褐衣演出者`,`你瞧，我的腿抬起了。`,`手和腳得一同配合。`,`再看一次這個架勢。`],[1e3,1180,160,270,`藍衣長鬚演出者`,`看臉，也看看我的手。`,`我們的裝扮各不相同。`,`你已經見過幾副長鬚？`],[1130,1100,140,280,`右側綠衣持竿者`,`右邊這根竿也別漏看。`,`我得兩隻手扶着呢。`,`竿子一直伸到上面呀。`],[1190,1260,140,250,`右下紅衣長鬚者`,`我的紅衣很熱鬧吧？`,`認人還得比對眉眼。`,`我和旁邊那位不同呢。`]]),qt(12,[[760,535,160,300,`門前抱童紅衣人`,`抱穩了，慢慢看燈。`,`你看到懷裡的小傢伙嗎？`,`他也想看外頭的熱鬧。`],[800,460,60,130,`懷中童子`,`我在這裡，也看得見！`,`你看見我伸出的手嗎？`,`抱着我就不怕走散啦。`],[605,590,80,200,`門邊童子`,`我手裡也有小玩意。`,`門外的燈更大呢。`,`我正想走出來看看。`],[165,1200,160,280,`左下黃衣持竿人`,`這盞燈掛在我竿頭。`,`長竿兩頭都要顧好。`,`看燈，也看看怎樣提燈。`],[850,1140,160,270,`下方藍衣人`,`孩子就在我旁邊呢。`,`你看他牽着我的手。`,`人多，還是牽緊些好。`],[750,1220,140,190,`牽手綠衣童子`,`我牽緊了才不會走散。`,`那盞燈我也想看看。`,`你要跟我們一起嗎？`],[1090,1250,140,230,`持瓶紅衣童子`,`我的小瓶要捧穩。`,`看我兩手怎樣拿着。`,`你也留意到這個了呀。`],[1200,1230,110,240,`背身紅衣童子`,`我轉過身去看了。`,`看背影，也能看出動作。`,`你在找前面的那一位？`]]),qt(15,[[80,395,145,170,`爐旁紅衣童子`,`這邊暖暖的，我先搓手。`,`你看我們靠着甚麼？`,`熱鬧之外也有暖意呢。`],[330,395,150,170,`爐旁綠衣童子`,`雙手伸近一點就暖了。`,`旁邊那位也和我一樣。`,`你發現這一處小火光了。`],[535,655,130,250,`台上紅衣人`,`台上也有我們站着看。`,`欄杆前後都有人呢。`,`別只看下面的街市呀。`],[630,660,140,260,`台上綠衣人`,`我在旁邊陪着看。`,`你看，台階連着庭院。`,`換個方向還有熱鬧。`],[940,655,145,260,`台上藍衣人`,`這兒正好望向下面。`,`我的手也一直拱着。`,`你找到不同的姿勢了嗎？`],[1190,700,110,240,`台邊紅衣人`,`你也看到石台這一端？`,`後頭還有同伴呢。`,`把每一排都看清吧。`],[1235,640,70,190,`後排藍衣人`,`我在後面，別漏了我。`,`人群裡也有我的面孔。`,`你這次看得更仔細了。`],[510,1065,140,260,`階下綠衣人`,`我正往庭前看呢。`,`台階上也有人朝這邊看。`,`誰在看誰，很有趣吧。`],[585,1110,160,260,`階下招手紅衣人`,`這一頭也有好東西。`,`看看我伸出去的手。`,`我指的就在前面呢。`],[455,1300,115,160,`提小燈紅衣童子`,`我這盞小燈也好看。`,`小燈掛在細竿那頭。`,`別只看那些大花燈呀。`],[910,1210,165,280,`貨郎擔中綠衣人`,`兩邊的小物都擺滿了。`,`上頭還掛着花燈呢。`,`你能認出多少件小物？`],[1230,1260,100,240,`貨郎旁背身紅衣人`,`我也在看這副擔子。`,`看的人可不只有你。`,`慢慢挑，先別急着走。`]]),qt(17,[[900,520,100,200,`階上持物童子`,`我也帶着小玩意來。`,`你看我抱的是甚麼？`,`走下台階再慢慢看。`],[1180,400,80,180,`階上童子`,`我在這個台階上呢。`,`大人走得可比我快。`,`你也要往庭前去嗎？`]]),qt(9,[[760,250,110,230,`幔旁紅衣人`,`我站在帳幔這一旁。`,`往下也能看見火光。`,`你把上頭也看清啦。`],[835,180,100,200,`幔旁綠衣人`,`後面也有我的身影。`,`別漏了帳幔旁這一排。`,`大家都朝庭院望呢。`],[870,335,120,240,`幔前紅衣人`,`我就在欄杆後面。`,`欄杆的線條畫得真細。`,`看人，也看看周圍呀。`]]),qt(2,[[300,640,90,200,`左側台上紅衣人`,`台上這一排也有人。`,`你看大家的手勢一樣嗎？`,`每一張臉都要看仔細。`],[400,660,90,200,`左側台上藍衣人`,`我在旁邊陪着看呢。`,`不妨比較我們的眉眼。`,`這回認清我了吧？`],[660,600,90,200,`中排台上紅衣人`,`這場熱鬧真是看不完。`,`你也在看庭前嗎？`,`我們都還站在這裡呢。`],[750,620,90,200,`中排台上綠衣人`,`我正朝着庭院看。`,`看見欄杆下面那些人？`,`高低兩處都有看頭。`],[850,635,90,200,`右側台上紅衣人`,`我可沒錯過這一陣。`,`旁邊的人也看得專心。`,`你又來找我的面孔啦。`],[900,650,80,200,`右側台上藍衣人`,`我在這一排的旁邊。`,`仔細看，衣紋也不同。`,`認人還是先看樣貌呀。`],[1120,680,65,120,`台上童子`,`我也探頭看看嘛。`,`大人旁邊還有我呢。`,`你終於留意到我啦。`],[1190,900,100,240,`台下捧物人`,`先讓我捧穩這一盤。`,`小物件可不能晃呀。`,`你也在看我的雙手？`]]),qt(1,[[1180,430,100,240,`殿內持物人`,`我在殿裡也忙着呢。`,`你從門外看進來了？`,`別漏了我手裡的東西。`],[95,730,70,130,`左側階上童子`,`台階這邊還有我。`,`我也想走到庭院去。`,`等一等，我跟着來呀。`],[75,1250,110,240,`牽童紅衣人`,`手牽着，才不會走散。`,`孩子還在看前頭呢。`,`我們也想去看買賣。`]]),qt(5,[[340,560,65,130,`幔旁童子`,`我也陪着坐在這裡。`,`庭前的戲真有趣。`,`你看看我的小小身影。`]]),qt(10,[[970,870,260,100,`橫身翻騰者`,`瞧，我的身子都飛起了！`,`手腳的方向看清沒？`,`這個姿勢可不容易呀。`],[835,1080,250,85,`橫臥表演者`,`低處也有我的本事。`,`你別只往上頭看呀。`,`再看我的手和腳。`]]);var Jt=Kt,Yt=[{number:6,x:-9.167,y:-2.828,width:578.029,height:666.956,scale:.444638,matches:684,sourceWidth:1300,sourceHeight:1500,matrix:[[.45169983513482476,-.0021213761351729712,-10.610745260974738],[.006654109394278121,.4464075061920651,-6.451103026130962],[72527056953978125e-22,7.851942386601564e-7,1]]},{number:5,x:533.527,y:-5.953,width:562.655,height:673.032,scale:.448688,matches:554,sourceWidth:1254,sourceHeight:1500,matrix:[[.44773501537170607,.0036818604476667838,528.9279933520861],[-.0025867001961592424,.4465547489365196,-3.3506902247598465],[-4165244822155644e-21,3.506949090220706e-7,1]]},{number:10,x:1067.387,y:-2.513,width:552.249,height:667.505,scale:.445003,matches:415,sourceWidth:1241,sourceHeight:1500,matrix:[[.45330413251046103,.0016243159158609059,1065.4396411826922],[.004449742661374
